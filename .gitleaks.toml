  '''nosotros\.val\d(?:Title|Desc)''',
  '''home\.servicesStep\d''',
  '''hotclick-dev-secret-key-2026-local-only-32chars''',
  '''hotclick-unit-test-secret-key-at-least-32-chars-for-hs256''',
  '''hotclick-test-secret-minimum-32-chars-hs256''',
  '''sk_test_placeholder''',
  '''hck_live_TESTKEY''',
  '''emprende\.paso\d(?:hint)?''',
  '''emprende\.pasoOwner\d(?:hint)?''',
  '''a11y\.filtro\w+''',
