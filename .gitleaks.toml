title = "HOTCLICK gitleaks config"
minVersion = "8.25.0"

[extend]
useDefault = true

# En v8.25 [allowlist] se reemplazÃ³ por [[allowlists]].
# Cada bloque se evalÃºa por separado (OR): si uno matchea, el hallazgo se ignora.

[[allowlists]]
description = "Build frontend, target Maven y templates sin valores reales"
paths = [
  '''Hot_click_outlet/src/main/resources/static/assets/.*''',
  '''Hot_click_outlet/src/main/resources/static/sw\.js''',
  '''Hot_click_outlet/src/main/resources/static/workbox-.*\.js''',
  '''.*/target/.*''',
  '''.*\.env\.example$''',
  '''security-tools/.*/\.env\.example$''',
  '''Hot_click_outlet/frontend/src/components/ui/accessibility/a11yConstants\.ts$''',
]

[[allowlists]]
description = "Archivos borrados que solo existen en el historial de git"
paths = [
  '''Hot_click_outlet/docker-compose\.yml$''',
  '''Hot_click_outlet/src/main/resources/static/admin/.*''',
]

# Gitleaks 8.30.1 NO suprime hallazgos con `commits = [...]` en [[allowlists]]
# globales (bug https://github.com/gitleaks/gitleaks/issues/2165: el continue
# no salta el commit). Esta lista documenta SHAs historicos; el gate real es
# `.gitleaksignore` (fingerprints). Paths/regexes de abajo SI funcionan.
[[allowlists]]
description = "Commits historicos que introdujeron secretos ya sacados de HEAD (rotar en el proveedor)"
commits = [
