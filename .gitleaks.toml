title = "HOTCLICK gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Falsos positivos conocidos, templates, y secretos historicos ya removidos de HEAD (rotar en el proveedor)"
paths = [
  '''Hot_click_outlet/src/main/resources/static/assets/.*''',
  '''Hot_click_outlet/src/main/resources/static/sw\.js''',
  '''Hot_click_outlet/src/main/resources/static/workbox-.*\.js''',
  '''.*/target/.*''',
  '''.*\.env\.example$''',
  '''security-tools/.*/\.env\.example$''',
  # Compose local viejo (borrado). El actual es docker-compose.prod.yml + .env
  '''Hot_click_outlet/docker-compose\.yml$''',
  # Admin HTML legacy (borrado; el panel vive en React)
  '''Hot_click_outlet/src/main/resources/static/admin/.*''',
]
regexes = [
  '''hc-admin-tour-v4-done''',
  '''nosotros\.val\d(?:Title|Desc)''',
  '''home\.servicesStep\d''',
  '''hotclick-dev-secret-key-2026-local-only-32chars''',
  '''hotclick-unit-test-secret-key-at-least-32-chars-for-hs256''',
  '''hotclick-test-secret-minimum-32-chars-hs256''',
]
