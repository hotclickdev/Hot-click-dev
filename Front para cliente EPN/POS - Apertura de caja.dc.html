<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ede5da;-webkit-font-smoothing:antialiased;}
a{color:#1747A8;text-decoration:none;}
a:hover{color:#102f6e;text-decoration:underline;}
</style>
</helmet>
<!-- POS · Apertura de caja -->
<div data-screen-label="POS - Apertura de caja" style="min-height:100vh;display:flex;flex-direction:column;font-family:'Public Sans',sans-serif;color:#1a1a1a">

  <!-- Barra superior del POS -->
  <header style="background:#1a1a1a;color:#ffffff;display:flex;align-items:center;gap:20px;padding:0 24px;height:60px;box-sizing:border-box;flex:none">
    <a href="Selector de modo.dc.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit">
      <div style="font-family:'Sora',sans-serif;font-weight:800;font-size:16px;letter-spacing:-0.4px;color:#ffffff">HOTCLICK</div>
      <div style="font-size:11px;font-weight:700;color:#1a1a1a;background:#ffffff;padding:3px 8px;border-radius:999px">Caja</div>
    </a>
    <div style="flex:1"></div>
    <div style="font-size:13px;color:#b8b3ab">Cajera: <span style="color:#ffffff;font-weight:600">Daniela</span></div>
    <a href="Sistema - Inicio.dc.html" style="font-size:13px;font-weight:600;color:#b8b3ab;border:1px solid #3a3a3a;border-radius:10px;padding:7px 12px" style-hover="color:#ffffff;text-decoration:none;border-color:#6b6b6b">← Sistema</a>
  </header>

  <!-- Contenido centrado -->
  <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:24px">
    <div style="width:100%;max-width:420px;background:#ffffff;border-radius:16px;padding:32px;display:flex;flex-direction:column;gap:20px;box-shadow:0 1px 2px rgba(26,26,26,0.04),0 8px 20px rgba(26,26,26,0.06);">

      <a href="Selector de modo.dc.html" style="font-size:14px;font-weight:600">← Volvé</a>

      <div style="display:flex;flex-direction:column;gap:6px;text-align:center">
        <div style="width:52px;height:52px;border-radius:999px;background:rgba(23,71,168,0.08);display:flex;align-items:center;justify-content:center;margin:0 auto 4px;font-family:'Sora',sans-serif;font-weight:800;font-size:20px;color:#1747A8">₡</div>
        <h1 style="margin:0;font-family:'Sora',sans-serif;font-weight:700;font-size:21px">Abrí la caja</h1>
        <p style="margin:0;font-size:14px;color:#6b6459">Contá el efectivo que hay ahorita en la caja antes de empezar a vender.</p>
      </div>

      <div style="display:flex;flex-direction:column;gap:6px">
        <label style="font-size:14px;font-weight:600">Efectivo inicial</label>
        <div style="display:flex;align-items:center;border:1px solid #d8cfc0;border-radius:10px;overflow:hidden">
          <span style="padding:14px 0 14px 16px;font-family:'Sora',sans-serif;font-weight:700;font-size:18px;color:#8a8378">₡</span>
          <input type="text" value="{{ monto }}" onChange="{{ cambiarMonto }}" style="flex:1;padding:14px 16px 14px 8px;border:none;font-family:'Sora',sans-serif;font-weight:700;font-size:18px;color:#1a1a1a;box-sizing:border-box" style-focus="outline:none">
        </div>
        <span style="font-size:13px;color:#8a8378">Este monto queda como base para dar vueltos.</span>
      </div>

      <div style="display:flex;flex-direction:column;gap:6px">
        <label style="font-size:14px;font-weight:600">Notas <span style="font-weight:400;color:#8a8378">(opcional)</span></label>
        <textarea rows="2" placeholder="Ej: Faltan monedas de ₡100." onChange="{{ cambiarNotas }}" style="padding:12px 14px;border:1px solid #d8cfc0;border-radius:10px;font-family:'Public Sans',sans-serif;font-size:15px;color:#1a1a1a;resize:vertical;box-sizing:border-box" style-focus="border-color:#1747A8;outline:none"></textarea>
      </div>

      <button onClick="{{ abrirCaja }}" style="display:flex;align-items:center;justify-content:center;height:54px;border:none;border-radius:10px;background:#E73B33;color:#ffffff;font-family:'Sora',sans-serif;font-weight:700;font-size:17px;cursor:pointer" style-hover="background:#d02f27">Abrí la caja y empezá a vender</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { monto: '50.000', notas: '' };

  abrirCaja() {
    const datos = {
      abierta: true,
      montoInicial: this.state.monto,
      notasApertura: this.state.notas,
      horaApertura: new Date().toISOString(),
    };
    try { localStorage.setItem('hotclick_pos_caja', JSON.stringify(datos)); } catch (e) {}
    window.location.href = 'POS - Nueva venta.dc.html';
  }

  renderVals() {
    return {
      monto: this.state.monto,
      cambiarMonto: (e) => this.setState({ monto: e.target.value }),
      cambiarNotas: (e) => this.setState({ notas: e.target.value }),
      abrirCaja: () => this.abrirCaja(),
    };
  }
}
</script>
</body>
</html>
