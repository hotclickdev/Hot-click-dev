sonar.projectKey=hotclickdev_Hot-click-dev
sonar.organization=hotclickdev

# Nombre visible en el dashboard de SonarCloud
sonar.projectName=Hot-click-dev
sonar.projectVersion=1.0

# Raíz del código fuente
sonar.sources=Hot_click_outlet/src/main/java,Hot_click_outlet/frontend/src
sonar.tests=Hot_click_outlet/src/test/java

# Exclusiones — no escanear archivos generados, dependencias ni scripts de testing/performance
sonar.exclusions=\
  Hot_click_outlet/frontend/node_modules/**,\
  Hot_click_outlet/frontend/dist/**,\
  Hot_click_outlet/src/main/resources/static/**,\
  **/target/**,\
  **/*.min.js,\
  **/sw.js,\
  **/workbox-*.js,\
  loadtest/**,\
  performance/**,\
  qa-automation/**,\
  Hot_click_outlet/azf.sql,\
  **/*Actualizado*.sql,\
  Hot_click_outlet/maven/**

# Cobertura de tests Java (generada por JaCoCo)
sonar.coverage.jacoco.xmlReportPaths=Hot_click_outlet/target/site/jacoco/jacoco.xml

# Encoding
sonar.sourceEncoding=UTF-8

# Reglas desactivadas — falsos positivos en este proyecto:
# - react/prop-types: el proyecto no usa PropTypes (patrón común en proyectos modernos con TS-style)
# - javascript:S2245: Math.random() en animaciones de UI y scripts de test
# - javascript:S1104: campos públicos en clases de utilidad
sonar.issue.ignore.multicriteria=e1,e2,e3

sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S6748
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.jsx

sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S6479
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.jsx

sonar.issue.ignore.multicriteria.e3.ruleKey=Web:BoldAndItalicTagsCheck
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.sql

# Java — versión del bytecode compilado
sonar.java.source=21
sonar.java.target=21

# JavaScript/React — parser moderno
sonar.javascript.lcov.reportPaths=Hot_click_outlet/frontend/coverage/lcov.info
