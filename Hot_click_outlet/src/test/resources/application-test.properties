# ============================================================
# Perfil de pruebas — H2 in-memory con compatibilidad PostgreSQL
# ============================================================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Sobreescribe spring.jpa.properties.hibernate.dialect=PostgreSQLDialect de application.properties.
# Necesario para que SELECT FOR UPDATE genere FOR UPDATE (H2) en vez de FOR NO KEY UPDATE (PG).
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Tablas nativas: H2TablasNativasSeeder + sql.init (Hibernate import_files parte el SQL por líneas).
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/h2/tablas-nativas-test.sql
spring.sql.init.continue-on-error=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=5

# JWT — mínimo 32 chars para HS256
jwt.secret=hotclick-test-secret-minimum-32-chars-hs256

# CORS
cors.allowed.origins=http://localhost:3000

# Email — bean está mockeado; valores solo para satisfacer @Value binding
sendgrid.api-key=SG.test-key-not-real
sendgrid.from-email=test@hotclick.cr
sendgrid.from-name=HOTCLICK_TEST

# Supabase — bean mockeado
supabase.url=http://localhost:9999
supabase.service-key=test-supabase-key

# PayXpert — ARCHIVADO 2026-05-21 (bean mockeado en tests, valores placeholder)
payxpert.api.url=https://connect2.payxpert.com
payxpert.originator.id=ARCHIVED
payxpert.originator.password=ARCHIVED
payxpert.callback.url=http://localhost:8080/api/webhooks/payxpert
payxpert.redirect.success.url=http://localhost:8080/pago/exito
payxpert.redirect.cancel.url=http://localhost:8080/pago/cancelado
payxpert.payment.ttl.minutes=30

# PayPal — bean mockeado
paypal.api.url=https://api-m.sandbox.paypal.com
paypal.client.id=test-client-id
paypal.client.secret=test-client-secret
paypal.webhook.id=test-webhook-id

# App
app.url=http://localhost:8080
app.tc.usd.fallback=530

# Deshabilitar módulos con schedulers externos
app.publication.enabled=false
app.abandoned-cart.enabled=false
app.abandoned-cart.hours-to-wait=24
app.abandoned-cart.scheduler-cron=0 0 0 31 2 ?

google.vision.api-key=test-key

# Flyway — deshabilitado en tests (H2 in-memory, ddl-auto=create-drop lo gestiona)
spring.flyway.enabled=false

# Cache — deshabilitada en tests para evitar dependencia de cacheManager en entityManagerFactory
spring.cache.type=none
# Tests heredados del flujo SINPE manual (deshabilitado en prod desde 16-oct-2026); SinpeManualDeshabilitadoTest cubre el default.
hotclick.checkout.sinpe-manual.habilitado=true
# ONVO en el checkout (decision del dueno, 21-oct-2026). Sin llave, OnvoService simula solo en test/dev.
payments.onvo.enabled=true

# Precios mensuales USD de prueba (supuesto: 9 Emprendedor / 24 Pyme / 49 Negocio Plus; pendiente de confirmar).
hotclick.planes.moneda=usd
hotclick.planes.emprendedor.precio-mensual-usd=9
hotclick.planes.pyme.precio-mensual-usd=24
hotclick.planes.negocio-plus.precio-mensual-usd=49

# Integración legacy: el efectivo web está apagado en prod (solo POS); los tests de flujo efectivo lo encienden aquí.
hotclick.checkout.efectivo-web.habilitado=true

sinpe.onvo.timeout-minutos=15

# Ver application-dev.properties: flag explícito de las cuentas demo @hotclick.test (solo dev/test).
hotclick.cupo-emprendedor.demo-correo-habilitado=true

# Barrido del aviso de reembolso: los tests lo llaman a mano (barrer()).
hotclick.aviso-reembolso.barrido.enabled=false
