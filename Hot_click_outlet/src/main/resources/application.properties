# ====================================================
# SERVER
# ====================================================
server.port=${PORT:8080}
# Render corre detrás de un proxy/load balancer —
# esto permite leer X-Forwarded-For, X-Forwarded-Proto correctamente
server.forward-headers-strategy=FRAMEWORK
spring.application.name=Hot_click_outlet

# ====================================================
# DATASOURCE — Supabase PostgreSQL (Transaction Pooler)
# ====================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari — ajustado al límite de Supabase free tier (max 5 conexiones simultáneas)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000

# ====================================================
# FLYWAY — migraciones de esquema
# ====================================================
# baseline-on-migrate: si no existe flyway_schema_history, marca V1 como ya aplicada
# (la DB existente en Supabase ya tiene el schema correcto — V1 no se ejecuta)
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# ====================================================
# JPA / HIBERNATE
# ====================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ====================================================
# LOGGING — Producción
# ====================================================
spring.output.ansi.enabled=NEVER
logging.level.root=WARN
logging.level.com.hotclick=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.com.zaxxer.hikari=WARN

# ====================================================
# JWT
# ====================================================
jwt.secret=${JWT_SECRET}

# ====================================================
# CORS
# ====================================================
cors.allowed.origins=${CORS_ALLOWED_ORIGINS}

# ====================================================
# SendGrid — email API (reemplaza SMTP, funciona en Render)
# ====================================================
sendgrid.api-key=${SENDGRID_API_KEY}
sendgrid.from-email=${SENDGRID_FROM_EMAIL:hotclick.cr@gmail.com}
sendgrid.from-name=${SENDGRID_FROM_NAME:HOTCLICK}

# ====================================================
# SUPABASE STORAGE
# ====================================================
supabase.url=${SUPABASE_URL:https://nkevwfcjhjaawtdqquns.supabase.co}
supabase.service-key=${SUPABASE_SERVICE_KEY}

# Multipart — imágenes hasta 10 MB por archivo, 30 MB por request (3 fotos)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

