# ====================================================
abuseipdb.api.key=${ABUSEIPDB_API_KEY:}

# ====================================================
# CLOUDFLARE TURNSTILE — anti-bot en login y registro
# Registro gratuito en dash.cloudflare.com → Turnstile
# Dejar vacío para deshabilitar (modo dev: siempre pasa)
# ====================================================
turnstile.secret.key=${TURNSTILE_SECRET_KEY:}

# ====================================================
# MODELO AGREGADOR — Comisiones (sobre el total bruto)
# El % cobrado al vendedor vive en hot_click_plan_tb.comision_porcentaje
# Desde V185 no hay mínimo por venta (comision_minima_crc queda en 0, solo historia).
# Aquí solo la reserva contable de la pasarela y fallbacks para empresas sin plan.
# ====================================================
hotclick.comision.gateway.pct=5
hotclick.comision.fallback.pct=9

# ====================================================
# PLANES (finanzas/planes_pendientes.md). Solo se usan para CREAR el plan si falta
# (BD vacía / tests); en una BD existente manda hot_click_plan_tb (V168), el seeder no la pisa.
# ====================================================
hotclick.planes.emprendedor.precio-mensual-crc=0
hotclick.planes.emprendedor.comision-pct=9.00
hotclick.planes.pyme.precio-mensual-crc=12900
hotclick.planes.pyme.comision-pct=7.50
hotclick.planes.negocio-plus.precio-mensual-crc=28900
hotclick.planes.negocio-plus.comision-pct=6.00
# Moneda en la que se cobran los planes (la de las propiedades *_PRECIO_MENSUAL_USD). El billing ONVO valida moneda y
# monto del cobro contra esta moneda y el precio del plan. SIN valor por defecto: si falta, el evento se trata como
# transitorio (500, ONVO reintenta) y el ledger no escribe; se define por entorno (ver .env.example).
hotclick.planes.moneda=${PLANES_MONEDA:}
# Precio mensual en USD por plan. SIN valor por defecto: si falta, la API responde 409 PLAN_SIN_PRECIO
# (nunca 0 ni precios viejos). Se definen por entorno; ver .env.example.
hotclick.planes.emprendedor.precio-mensual-usd=${EMPRENDEDOR_PRECIO_MENSUAL_USD:}
hotclick.planes.pyme.precio-mensual-usd=${PYME_PRECIO_MENSUAL_USD:}
hotclick.planes.negocio-plus.precio-mensual-usd=${NEGOCIO_PLUS_PRECIO_MENSUAL_USD:}
# Emprendedor: los primeros N negocios (cupo V127, hot_click_cupo_emprendedor_tb) reciben un trial de M días.
# Terminado el trial pagan la mensualidad USD de arriba, cobrada automática y solo por ONVO. Del N+1 en adelante
# no hay trial (queda pendiente de pago). N y M son configurables, nada va fijo en código.
hotclick.trial-emprendedor.cupo=${TRIAL_EMPRENDEDOR_CUPO:70}
hotclick.trial-emprendedor.dias=${TRIAL_EMPRENDEDOR_DIAS:90}
# Cron del cierre diario de trials vencidos (por defecto 03:30 hora de Costa Rica).
hotclick.trial-emprendedor.cierre-cron=${TRIAL_EMPRENDEDOR_CIERRE_CRON:0 30 3 * * *}

# ====================================================
# COBROS Y PAGOS A VENDEDORES
# ====================================================
# Días de gracia si no paga la mensualidad (26-oct-2026: 8). Día 1 = día siguiente a fecha_fin;
# el día 8 vende normal, desde el día 9 la tienda queda SUSPENDIDO_IMPAGO (oculta, sin ventas) hasta pagar.
hotclick.billing.dias-gracia=8
# A5-01: días máximos que una suscripción ONVO puede quedar en "incierta" (ONVO no verificable por GET), contados
# desde fecha_fin + dias-gracia. Pasado el plazo sigue el flujo normal de impago (PAST_DUE / VENCIDO) con alerta.
# Valor de negocio: sin él, un error permanente de ONVO dejaría la suscripción gratis para siempre.
hotclick.billing.dias-max-incierta=7
# B1: tras N reconsultas INCIERTA seguidas en una misma corrida nocturna se dejan de hacer GET a ONVO (0 = sin corte).
hotclick.billing.max-inciertas-seguidas=5
# Espera máxima (ms) por el lock de la fila en la transacción por fila de la reconsulta (PostgreSQL; 0 = sin tope).
hotclick.billing.lock-timeout-ms=5000
# Admin "Dar 3 días extra" sobre una suspensión por impago (una vez por ciclo). Rango válido 1-30.
hotclick.billing.dias-extension-impago=3
# Auditor 5 S-07: plan que recibe el trial de 14 días.
hotclick.billing.plan-trial=PYME
# Tamaño de lote de bajas por impago: se procesan TODOS los vencidos en lotes de este tamaño (día 9 exacto).
hotclick.billing.max-bajas-por-corrida=25
# Día de cobro por defecto (el vendedor elige 28 o 13).
hotclick.billing.dia-cobro-default=28
# Primer período: DIAS cobra solo los días hasta el día de cobro (por defecto); NINGUNO cobra el mes completo.
hotclick.billing.prorrateo=${HOTCLICK_BILLING_PRORRATEO:DIAS}
# Sin ubicación de despacho no se aprueba el negocio ni se publican productos nuevos.
hotclick.ubicacion-despacho.obligatoria=${UBICACION_DESPACHO_OBLIGATORIA:false}

# ====================================================
# WEBAUTHN / FIDO2 — llaves de seguridad físicas para ADMIN_IT
# En producción: rpId debe coincidir con el dominio del sitio (hotclick.lat)
# En dev local: usar localhost
# ====================================================
webauthn.rp-id=${WEBAUTHN_RP_ID:hotclick.lat}
webauthn.rp-name=${WEBAUTHN_RP_NAME:HotClick}

# ====================================================
# PROXIES DE CONFIANZA — resolución de la IP del cliente
# ClientIpResolver solo cree en X-Forwarded-For / X-Real-IP si la conexión TCP viene
# de uno de estos rangos. Desde cualquier otra IP los headers se descartan y se usa el
# peer real, así nadie puede rotar su identidad y evadir el rate limiting ni el bloqueo
# de IPs del Security Center mandando un header inventado.
# Valor: lista separada por comas de IPs o CIDRs, más el alias "private".
#   private → loopback + rangos privados (RFC1918/RFC4193). Sirve tal cual en EC2+Nginx
#             (el peer es el gateway de Docker) y en Render (red interna 10.x).
#   vacío   → no confiar en ningún header (app expuesta directo a Internet).
#   Para máxima estrictez, poner la IP exacta del proxy: SECURITY_TRUSTED_PROXIES=172.17.0.1
# ====================================================
security.trusted-proxies=${SECURITY_TRUSTED_PROXIES:private}

# ====================================================
# HASHING DE CONTRASEÑAS — work factor de bcrypt
# El cost va dentro del hash ($2a$<cost>$...): subirlo NO invalida los
# hashes existentes, solo encarece los nuevos. Cada +1 duplica el tiempo
# de verificación (10 ≈ 60 ms, 12 ≈ 250 ms en el t3.small de producción).
# Rango aceptado 10–15; fuera de rango el backend loguea y cae a 12.
# Ruta a Argon2id: docs/plan-argon2id-hashing-contrasenas.md
# ====================================================
security.password.bcrypt-cost=${BCRYPT_COST:12}

# ── Regla anti-bot de reservas de stock (QA-CONC-4) ──────────────────────────
# Si un mismo identificador (usuario logueado → su id; invitado → IP del cliente) reserva MÁS de
# max-unidades unidades, en reservas con pago pendiente, dentro de ventana-minutos, esas reservas
# se liberan liberar-en-minutos después (las libera el scheduler de expiración, que corre cada 5 min).
# Valores por defecto a decidir por el dueño (se barajó 5 o 10 unidades y 10 o 15 minutos).
hotclick.reservas.antibot.habilitado=${RESERVAS_ANTIBOT_HABILITADO:true}
hotclick.reservas.antibot.max-unidades=${RESERVAS_ANTIBOT_MAX_UNIDADES:10}
hotclick.reservas.antibot.ventana-minutos=${RESERVAS_ANTIBOT_VENTANA_MINUTOS:15}
hotclick.reservas.antibot.liberar-en-minutos=${RESERVAS_ANTIBOT_LIBERAR_EN_MINUTOS:15}

# Liquidaciones del wallet (V169). Contra entrega: diario, lo del día anterior.
# Tarjeta: días de corte por frecuencia (pendiente confirmar días con HOT_CLICK).
hotclick.payout.cron=0 30 6 * * *
# Días de corte de liquidación (configurables por entorno)
hotclick.payout.dias-quincenal=${HOTCLICK_PAYOUT_DIAS_QUINCENAL:1,16}
hotclick.payout.dias-mensual=${HOTCLICK_PAYOUT_DIAS_MENSUAL:1}

# Envío Normal contra entrega: PEDIDO_COMPLETO (default) | SOLO_ENVIO
hotclick.envio.normal.contra-entrega=${ENVIO_NORMAL_CONTRA_ENTREGA:PEDIDO_COMPLETO}

# Retención de hot_click_wa_log_tb (WaMensajeLog). PROVISIONAL: pendiente de confirmación legal (leg-costa-rica).
hotclick.wa.mensaje-log.retencion-dias=${WA_MENSAJE_LOG_RETENCION_DIAS:30}
# Cuentas conectadas ONVO (marketplace) por empresa. Vigencia del onboardingUrl (ISO-8601) y poller de estado.
onvo.cuentas.onboarding-vigencia=${ONVO_CUENTAS_ONBOARDING_VIGENCIA:P7D}
onvo.cuentas.poller.enabled=${ONVO_CUENTAS_POLLER_ENABLED:true}
onvo.cuentas.poller.intervalo-ms=${ONVO_CUENTAS_POLLER_INTERVALO_MS:600000}
onvo.cuentas.poller.lote=50

# INF-03: aviso de pedidos ONVO pendientes (Telegram usa TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID)
onvo.alertas.pendiente-minutos=${ONVO_PENDIENTE_MINUTOS:30}
# INF-03: alerta a Telegram si hay más de UMBRAL 401 (secret inválido) del webhook ONVO en la ventana. 0 = apagado.
onvo.alertas.webhook-secret-invalido.umbral=${ONVO_WEBHOOK_401_UMBRAL:0}
onvo.alertas.webhook-secret-invalido.ventana-minutos=${ONVO_WEBHOOK_401_VENTANA_MIN:10}

# ALTO-1: tope de costo del asistente público (antes del LLM). Override por env.
# Cupo diario del asistente (chat público, asistente de compras y búsqueda por imagen).
# El día es calendario en la zona indicada (reinicio a medianoche de Costa Rica).
asistente.cuota.zona=${ASISTENTE_CUOTA_ZONA:America/Costa_Rica}
asistente.cuota.cliente-dia=${ASISTENTE_CUOTA_CLIENTE_DIA:20}
asistente.cuota.plan.emprendedor=${ASISTENTE_CUOTA_PLAN_EMPRENDEDOR:100}
asistente.cuota.plan.pyme=${ASISTENTE_CUOTA_PLAN_PYME:300}
asistente.cuota.plan.negocio-plus=${ASISTENTE_CUOTA_PLAN_NEGOCIO_PLUS:1000}
asistente.cuota.marketplace-dia=${ASISTENTE_CUOTA_MARKETPLACE_DIA:1000}
asistente.cuota.global-dia=${ASISTENTE_CUOTA_GLOBAL_DIA:3000}
# Topes por red (0 = desactivado): IP exacta (IPv6 /64), subred /24 (IPv6 /48) y subred x negocio.
# Evitan vaciar el cupo de un negocio por su slug o el global rotando visitorId/IPs.
asistente.cuota.ip-dia=${ASISTENTE_CUOTA_IP_DIA:60}
asistente.cuota.subred-dia=${ASISTENTE_CUOTA_SUBRED_DIA:200}
asistente.cuota.subred-negocio-dia=${ASISTENTE_CUOTA_SUBRED_NEGOCIO_DIA:40}
# Alerta (log ERROR -> Sentry) la primera vez del dia que se llega al tope global.
asistente.cuota.alerta-global=${ASISTENTE_CUOTA_ALERTA_GLOBAL:true}

# Teléfono de soporte mostrado en avisos de Telegram. Sin default: vacío ⇒ se omite la línea.
hotclick.soporte.telefono=${HOTCLICK_SOPORTE_TELEFONO:}

# 2FA: topes por IP de /api/auth/2fa/setup|activate|disable (solicitudes por ventana en segundos).
# Contador compartido en hot_click_rate_limit_tb (RateLimiter). Se superan => 429.
hotclick.ratelimit.2fa-setup.max=${RL_2FA_SETUP_MAX:5}
hotclick.ratelimit.2fa-setup.window=${RL_2FA_SETUP_WINDOW:300}
hotclick.ratelimit.2fa-activate.max=${RL_2FA_ACTIVATE_MAX:10}
hotclick.ratelimit.2fa-activate.window=${RL_2FA_ACTIVATE_WINDOW:300}
hotclick.ratelimit.2fa-disable.max=${RL_2FA_DISABLE_MAX:5}
hotclick.ratelimit.2fa-disable.window=${RL_2FA_DISABLE_WINDOW:300}
# Tope por usuario (no por IP) en /2fa/*: gestión con sesión (setup, activate, disable, recovery-codes/regenerate, email/*)
hotclick.ratelimit.2fa-usuario.max=${RL_2FA_USUARIO_MAX:15}
hotclick.ratelimit.2fa-usuario.window=${RL_2FA_USUARIO_WINDOW:300}
# Login con tempToken: /2fa/verify y /2fa/email/send
hotclick.ratelimit.2fa-login-usuario.max=${RL_2FA_LOGIN_USUARIO_MAX:10}
hotclick.ratelimit.2fa-login-usuario.window=${RL_2FA_LOGIN_USUARIO_WINDOW:300}

# Gift cards: tope por usuario de GET /api/gift-cards/validar (fail-closed) y saldo máximo al crear (colones).
hotclick.ratelimit.giftcard-validar.max=${RL_GIFTCARD_VALIDAR_MAX:10}
hotclick.ratelimit.giftcard-validar.window=${RL_GIFTCARD_VALIDAR_WINDOW:60}
hotclick.giftcard.monto-maximo=${GIFTCARD_MONTO_MAXIMO:1000000}

# M4 (IVA): permite cambiar el régimen de IVA de una empresa. APAGADO hasta tener el OK de Andrés.
hotclick.iva.cambio-regimen.enabled=${HOTCLICK_IVA_CAMBIO_REGIMEN_ENABLED:false}

# Cola de contingencia de Hacienda: minutos en PROCESANDO tras los cuales una fila se considera trabada y vuelve a PENDIENTE.
hotclick.facturacion.contingencia.procesando-timeout-minutos=${HOTCLICK_CONTINGENCIA_PROCESANDO_TIMEOUT_MIN:30}

# Área 7 N2: emisión automática del tiquete de compra (apagada hasta probar el flujo manual).
hacienda.emision-automatica=${HACIENDA_EMISION_AUTOMATICA:false}
