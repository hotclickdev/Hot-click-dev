# ====================================================
# SERVER
# ====================================================
server.port=${PORT:8080}

# ====================================================
# INTERNAL SECRET — requerido en header X-Internal-Secret para endpoints server-only
# Configurar INTERNAL_SECRET como variable de entorno en producción.
# Si está vacío, los endpoints protegidos quedan completamente bloqueados.
# ====================================================
internal.secret=${INTERNAL_SECRET:}

# ====================================================
# N8N — webhooks de automatización (dejar vacío para deshabilitar)
# ====================================================
n8n.webhook.pedido-nuevo=${N8N_WEBHOOK_PEDIDO_NUEVO:}
n8n.webhook.pedido-entregado=${N8N_WEBHOOK_PEDIDO_ENTREGADO:}
n8n.webhook.carrito-abandonado=${N8N_WEBHOOK_CARRITO_ABANDONADO:}
n8n.webhook.usuario-registrado=${N8N_WEBHOOK_USUARIO_REGISTRADO:}

# ====================================================
# ADMIN IT — notificaciones internas por email y WhatsApp
# Configurar en el .env del EC2:
#   ADMINIT_EMAIL=hotclick.cr@gmail.com
#   ADMINIT_TELEFONO=<telefono>
# ====================================================
adminit.email=${ADMINIT_EMAIL:}
adminit.telefono=${ADMINIT_TELEFONO:}
# Render corre detrás de un proxy/load balancer —
# esto permite leer X-Forwarded-For, X-Forwarded-Proto correctamente
server.forward-headers-strategy=FRAMEWORK
spring.application.name=Hot_click_outlet

# ====================================================
# DATASOURCE — Supabase PostgreSQL (Transaction Pooler)
# ====================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari — AWS RDS db.t4g.micro soporta 60+ conexiones; 10 es seguro incluso en 2 pods
# Virtual threads liberan conexiones más rápido → pool pequeño alcanza para alta concurrencia
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000

# ====================================================
# FLYWAY — migraciones de esquema
# ====================================================
# INF-06: baseline-on-migrate y out-of-order APAGADOS por defecto.
# baseline-on-migrate: solo para adoptar una base existente SIN flyway_schema_history
# (bootstrap legacy de Supabase). Prod ya tiene historial; dev vacío hace baseline explícito
# en FlywayRepairConfig. Habilitable con SPRING_FLYWAY_BASELINE_ON_MIGRATE=true.
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
# out-of-order: V194 entró a master después de V195 (#299 01:13 → #301 01:37 CR, 26-oct).
# Una base que ya tiene V194 aplicada no necesita out-of-order. Una base con V195 y SIN V194
# fallaría el validate: en ese caso arrancar una vez con SPRING_FLYWAY_OUT_OF_ORDER=true.
spring.flyway.out-of-order=${SPRING_FLYWAY_OUT_OF_ORDER:false}

# ====================================================
# JPA / HIBERNATE
# ====================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ====================================================
# LOGGING — Producción
# ====================================================
spring.output.ansi.enabled=NEVER
logging.level.root=WARN
logging.level.com.hotclick=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.com.zaxxer.hikari=WARN

# ====================================================
# SENTRY — monitoreo de errores en producción
# Dejar SENTRY_DSN vacío para deshabilitar (dev/test no reportan)
# ====================================================
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:production}
sentry.traces-sample-rate=0.1
# 1 = después de @ExceptionHandler (order 0). No reportar 4xx ya manejados.
sentry.exception-resolver-order=1
sentry.send-default-pii=false
sentry.in-app-includes=com.hotclick
sentry.logging.minimum-event-level=ERROR
sentry.logging.minimum-breadcrumb-level=INFO
sentry.ignored-exceptions-for-type=java.util.NoSuchElementException,org.springframework.security.access.AccessDeniedException,org.springframework.web.bind.MethodArgumentNotValidException,jakarta.validation.ConstraintViolationException,org.springframework.http.converter.HttpMessageNotReadableException,org.springframework.web.servlet.resource.NoResourceFoundException,org.springframework.web.HttpRequestMethodNotSupportedException,org.springframework.web.multipart.MaxUploadSizeExceededException,org.springframework.web.multipart.MultipartException,java.lang.IllegalArgumentException,java.lang.SecurityException,com.hotclick.exception.PlanLimitException,com.hotclick.exception.StockInsuficienteException,com.hotclick.exception.TenantAccessDeniedException,com.hotclick.exception.TenantNotFoundException,org.apache.catalina.connector.ClientAbortException,org.springframework.web.context.request.async.AsyncRequestNotUsableException

# ====================================================
# POSTHOG — captura server-side (pedido_pagado). Vacío = no envía.
# ====================================================
posthog.project-token=${POSTHOG_PROJECT_TOKEN:}
posthog.host=${POSTHOG_HOST:https://us.i.posthog.com}

# ====================================================
# META — solo Insights de gasto en anuncios (vacío = desactivado). Pixel y CAPI apagados: sin publicidad.
# ====================================================
meta.capi-access-token=${META_CAPI_ACCESS_TOKEN:}
meta.ad-account-id=${META_AD_ACCOUNT_ID:}

# ====================================================
# GA4 Measurement Protocol (purchase server-side)
# ====================================================
ga4.measurement-id=${GA4_MEASUREMENT_ID:}
ga4.mp-api-secret=${GA4_MP_API_SECRET:}

# Embudo público: tope por IP y hora (varias visitas, sin datos personales).
embudo.publico.max-por-hora=120

# ====================================================
# JWT
# ====================================================
jwt.secret=${JWT_SECRET}

# ====================================================
# TOTP SECRET ENCRYPTION (AES-256-GCM)
# Generate a 32-byte hex key: openssl rand -hex 32
# Set TOTP_ENCRYPTION_KEY env var in Render.
# Without this key, secrets are stored unencrypted (dev only).
# ====================================================
totp.encryption.key=${TOTP_ENCRYPTION_KEY:}

# ====================================================
# CORS
# ====================================================
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://localhost:5173,https://hotclick.lat}

# ====================================================
# SendGrid — email API (reemplaza SMTP)
# ====================================================
sendgrid.api-key=${SENDGRID_API_KEY:}
sendgrid.from-email=${SENDGRID_FROM_EMAIL:no-reply@hotclick.lat}
sendgrid.from-name=${SENDGRID_FROM_NAME:HOTCLICK}
# Selector de proveedor de correo. Por defecto sendgrid (prod no cambia).
# smtp solo con MAIL_PROVIDER=smtp + SPRING_MAIL_HOST/SPRING_MAIL_PORT (p.ej. Mailpit local).
# Valor desconocido o smtp sin host => falla al arrancar (fail closed, sin fallback).
mail.provider=${MAIL_PROVIDER:sendgrid}

# ====================================================
# AWS S3 — almacenamiento de imágenes y archivos
# ====================================================
aws.s3.bucket=${AWS_S3_BUCKET:hotclick-media}
aws.s3.region=${AWS_S3_REGION:us-east-2}
aws.s3.public-url=${AWS_S3_PUBLIC_URL:https://hotclick-media.s3.us-east-2.amazonaws.com}
# C1: duración (segundos) de la URL firmada de comprobantes SINPE privados.
sinpe.comprobante.url-firmada-segundos=${SINPE_COMPROBANTE_URL_FIRMADA_SEGUNDOS:300}

# Multipart — imágenes hasta 10 MB, catálogos PDF hasta 30 MB (ver CatalogoImportService)
# NOSONAR: Los límites son intencionales para permitir subida de imágenes de producto de alta calidad
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB
# Tomcat rechaza el POST antes de llegar a Spring si no se sube este límite —
# su default es 2MB y es independiente de spring.servlet.multipart.* (causaba 413 en PDFs > 2MB)
server.tomcat.max-http-form-post-size=30MB
# SSE del copilot dura hasta 120s. El default de MVC (30s) cierra el chunked a mitad.
spring.mvc.async.request-timeout=130000

# URL pública de la app — usada por PayPalConfig y StripePaymentProvider para return_url / cancel_url
app.url=${APP_URL:https://hotclick.lat}

# Chromium headless (Alpine, instalado en el Dockerfile) — fallback de CatalogoImportService
# para sitios JS/SPA. Vacío por defecto: si no está instalado (dev local), el fallback se salta.
chrome.bin=${CHROME_BIN:}
chromedriver.path=${CHROMEDRIVER_PATH:}

# ====================================================
# MÓDULO PUBLICACIÓN AUTOMATIZADA
# ====================================================
# Google Vision/Gemini — opcionales. Sin key, los servicios de análisis de imagen
# quedan deshabilitados (fail-open). Reemplazados por Claude (Anthropic).
google.vision.api-key=${GOOGLE_VISION_API_KEY:}
google.gemini.api-key=${GEMINI_API_KEY:}
# Voyage AI — embeddings para el Asistente de Compras RAG (recomendado por Anthropic)
# Obtén una key gratis en: https://dash.voyageai.com (200M tokens/mes gratis)
voyage.api-key=${VOYAGE_API_KEY:}
app.tc.usd.fallback=530
app.publication.enabled=true
app.publication.interval-ms=1800000

# ====================================================
# ACTUATOR
# spring-boot-starter-actuator NO está instalado (intencionalmente).
# Sin él no existen endpoints /actuator/** — más seguro que protegerlos.
# Si en el futuro se agrega, descomentar y restringir:
#   management.endpoints.web.exposure.include=health,info
#   management.endpoint.health.show-details=never
# SecurityConfig ya tiene: .requestMatchers("/actuator/**").hasRole("ADMIN_IT")
# ====================================================

# ====================================================
# VIRTUAL THREADS (Java 21+) — reemplaza los 200 hilos pesados de Tomcat
# por hilos ultraligeros del JVM. Miles de requests concurrentes sin costo extra.
# ====================================================
spring.threads.virtual.enabled=true

# ====================================================
# COMPRESIÓN GZIP — reduce tamaño de respuestas JSON un 60-70%
# ====================================================
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

# ====================================================
# ERROR RESPONSES — nunca exponer stack traces en producción
# GlobalExceptionHandler captura todas las excepciones conocidas.
# Estas propiedades cubren el fallback de Spring Boot (/error).
# ====================================================
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# ====================================================
# CACHE — Caffeine in-process (L1)
# TTL y tamaño configurados en CacheConfig.java (por nombre de caché).
# spring.cache.caffeine.spec eliminado — CacheConfig lo reemplaza con
# cachés diferenciados: tenantInfo=120s, empresaFlags=60s, default=120s
# ====================================================
spring.cache.type=caffeine

# ====================================================
# CARRITO ABANDONADO
# ====================================================
app.abandoned-cart.enabled=true
app.abandoned-cart.hours-to-wait=1
app.abandoned-cart.scheduler-cron=0 0 */6 * * *

# ====================================================
# STRIPE — Billing Engine (F14)
# STRIPE_SECRET_KEY: sk_live_... o sk_test_... (vacío = modo MOCK)
# STRIPE_WEBHOOK_SECRET: whsec_... (del dashboard de Stripe)
# STRIPE_PRICE_ID_PRO: price_... (Plan PRO mensual)
# STRIPE_PRICE_ID_ENTERPRISE: price_... (Plan Enterprise mensual)
# ====================================================
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.price-id.pro=${STRIPE_PRICE_ID_PRO:price_pro_placeholder}
stripe.price-id.enterprise=${STRIPE_PRICE_ID_ENTERPRISE:price_enterprise_placeholder}

# ====================================================
# ONVO PAY — Pasarela de tarjetas para la tienda (Costa Rica)
# ONVO_SECRET_KEY: onvo_live_secret_key_... o onvo_test_secret_key_... (vacío = modo MOCK)
# ONVO_WEBHOOK_SECRET: webhook_secret_... (del dashboard de ONVO)
# ====================================================
onvo.secret-key=${ONVO_SECRET_KEY:}
onvo.webhook-secret=${ONVO_WEBHOOK_SECRET:}
onvo.publishable-key=${ONVO_PUBLISHABLE_KEY:}
# Vencimiento de pagos pendientes (cleanup) e intervalo del job; reconsulta a ONVO desde el endpoint de estado.
hotclick.pagos.onvo.vencimiento-minutos=${HOTCLICK_PAGOS_ONVO_VENCIMIENTO_MINUTOS:30}
hotclick.pagos.onvo.cleanup-intervalo-ms=${HOTCLICK_PAGOS_ONVO_CLEANUP_INTERVALO_MS:300000}
hotclick.pagos.onvo.estado-reconsulta-segundos=${HOTCLICK_PAGOS_ONVO_ESTADO_RECONSULTA_SEGUNDOS:10}
# Sin default: vacío = SINPE manual del checkout en «Próximamente» (fail-closed).
onvo.sinpe-destino=${ONVO_SINPE_DESTINO:}
# POS SINPE por ONVO: minutos (1-30) antes de cancelar el intent (ONVO no lo vence solo). Fuera de rango = SINPE POS apagado.
pos.sinpe-onvo.timeout-minutos=${POS_SINPE_ONVO_TIMEOUT_MINUTOS:10}
pos.sinpe-onvo.barrido-ms=${POS_SINPE_ONVO_BARRIDO_MS:60000}
# P-01 SINPE marketplace por ONVO: plazo interno HotClick (1..1440 min). Vacío = SINPE deshabilitado (fail-closed).
sinpe.onvo.timeout-minutos=${SINPE_ONVO_TIMEOUT_MINUTOS:}
sinpe.onvo.barrido-ms=${SINPE_ONVO_BARRIDO_MS:60000}
# ALTO 2: minutos que el QR del POS reserva el stock (vacío o <= 0 = no se generan QR, fail-closed).
pos.qr.reserva-minutos=${POS_QR_RESERVA_MINUTOS:30}
# MEDIO 3: máximo de QR pendientes con stock reservado por empresa (vacío/≤0 = no se generan QR, fail-closed)
pos.qr.max-pendientes-empresa=${POS_QR_MAX_PENDIENTES_EMPRESA:20}
pos.qr.reserva-barrido-ms=${POS_QR_RESERVA_BARRIDO_MS:60000}
onvo.price-id.emprendedor=${ONVO_PRICE_ID_EMPRENDEDOR:}
onvo.price-id.pyme=${ONVO_PRICE_ID_PYME:}
onvo.price-id.negocio-plus=${ONVO_PRICE_ID_NEGOCIO_PLUS:}

# Tilopay (SDK embebido — tarjeta). Sin credenciales el modo simulado solo corre en perfiles dev/test.
# En cualquier otro perfil los pagos con tarjeta quedan deshabilitados (no se aprueban).
tilopay.api-user=${TILOPAY_API_USER:}
tilopay.password=${TILOPAY_PASSWORD:}
tilopay.key=${TILOPAY_KEY:}
tilopay.base-url=${TILOPAY_BASE_URL:https://app.tilopay.com}
tilopay.webhook-secret=${TILOPAY_WEBHOOK_SECRET:}
payments.onvo.enabled=${PAYMENTS_ONVO_ENABLED:false}
# Opt-in: permite llave onvo_test_ fuera de dev/test (checkout en modo prueba). Default false.
payments.onvo.permitir-llave-test=${PAYMENTS_ONVO_PERMITIR_LLAVE_TEST:false}

# ====================================================
# ANTHROPIC / CLAUDE — chat de tienda, copilot admin/Telegram, descripciones, RAG
# ====================================================
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-haiku-4-5-20251001}
# Precio del modelo (USD por millon de tokens) para el costo estimado del panel admin.
# Defaults = Claude Haiku 4.5 (tarifa publica Anthropic, 26-oct-2026). Cambiarlos si cambia anthropic.model.
ia.precio.input-por-m=${IA_PRECIO_INPUT_POR_M:1.00}
ia.precio.output-por-m=${IA_PRECIO_OUTPUT_POR_M:5.00}
ia.precio.cache-lectura-por-m=${IA_PRECIO_CACHE_LECTURA_POR_M:0.10}
ia.precio.cache-escritura-por-m=${IA_PRECIO_CACHE_ESCRITURA_POR_M:1.25}
# Claude Sonnet 4.6 (claude-sonnet-4-6; tarifa publica Anthropic verificada 27-oct-2026). Se usa cuando el
# modelo contiene "sonnet" (p. ej. IncidentClaudeClient sin ANTHROPIC_MODEL). Negativos/NaN = no arranca.
ia.precio.sonnet.input-por-m=${IA_PRECIO_SONNET_INPUT_POR_M:3.00}
ia.precio.sonnet.output-por-m=${IA_PRECIO_SONNET_OUTPUT_POR_M:15.00}
ia.precio.sonnet.cache-lectura-por-m=${IA_PRECIO_SONNET_CACHE_LECTURA_POR_M:0.30}
ia.precio.sonnet.cache-escritura-por-m=${IA_PRECIO_SONNET_CACHE_ESCRITURA_POR_M:3.75}
# Chat público: tope por visitante (IP) y tope de costo del modelo por empresa.
# Superado el de empresa, el chat sigue respondiendo con búsqueda sin IA.
chat.publico.max-diario-visitante=${CHAT_PUBLICO_MAX_DIARIO_VISITANTE:60}
chat.publico.max-diario-empresa=${CHAT_PUBLICO_MAX_DIARIO_EMPRESA:3000}
# Tope global (todas las tiendas). Fail-closed: si el contador falla, sin IA.
chat.publico.max-diario-global=${CHAT_PUBLICO_MAX_DIARIO_GLOBAL:5000}

# ====================================================
# AI COPILOT — Claude (Anthropic). Misma key que el chat de tienda.
# NVIDIA NIM queda para guardrails/deepteam (testing), no para el panel.
# ====================================================
nvidia.api-key=${NVIDIA_API_KEY:}
nvidia.model=${NVIDIA_MODEL:meta/llama-3.3-70b-instruct}
# Sidecar NeMo Guardrails (opcional, red-team). El copilot de admin ya no
# llama a NVIDIA. Ver security-tools/guardrails/README.md.
nvidia.base-url=${NVIDIA_BASE_URL:https://integrate.api.nvidia.com/v1/}

# ====================================================
# TELEGRAM — Alertas operacionales
# TELEGRAM_BOT_TOKEN: token del bot (@hotclick_alertas_bot)
# TELEGRAM_CHAT_ID: ID del chat donde llegan las alertas
# UPTIME_WEBHOOK_SECRET: string secreto que UptimeRobot incluye en el webhook
# ====================================================
telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
telegram.chat-id=${TELEGRAM_CHAT_ID:}
uptime.webhook-secret=${UPTIME_WEBHOOK_SECRET:}
sentry.webhook-secret=${SENTRY_WEBHOOK_SECRET:}

# ====================================================
# TELEGRAM — Bot para clientes (Emprendedor/PyME/Negocio Plus)
# TELEGRAM_CLIENT_BOT_TOKEN: token de BotFather del bot de clientes
# TELEGRAM_CLIENT_BOT_USERNAME: username del bot SIN @ (para el deep link t.me)
# TELEGRAM_CLIENT_WEBHOOK_SECRET: secreto que Telegram reenvía en cada update
#   (X-Telegram-Bot-Api-Secret-Token) — generar uno aleatorio largo
# ====================================================
telegram.client.bot-token=${TELEGRAM_CLIENT_BOT_TOKEN:}
telegram.client.bot-username=${TELEGRAM_CLIENT_BOT_USERNAME:}
telegram.client.webhook-secret=${TELEGRAM_CLIENT_WEBHOOK_SECRET:}

# ====================================================
# GITHUB — Incident Remediation Bot
# GITHUB_TOKEN: Personal Access Token con permisos repo (Contents + Pull requests)
# GITHUB_REPO: owner/repo del repositorio
# ====================================================
github.token=${GITHUB_TOKEN:}
github.repo=${GITHUB_REPO:hotclickdev/Hot-click-dev}

# ====================================================
# RAG — Shopping Assistant — Embedding indexer
# Requiere GEMINI_API_KEY (misma key que Google Vision) para búsqueda semántica.
# ====================================================
rag.indexer.cron=${RAG_INDEXER_CRON:0 0 4 * * *}
rag.indexer.batch-delay-ms=${RAG_INDEXER_BATCH_DELAY_MS:400}

# ====================================================
# F29 — RESILIENCE4J (circuit breaker / retry)
# Protege llamadas a servicios externos: Stripe, Hacienda, Claude, Supabase
# ====================================================
# Circuit breaker: se abre tras 5 fallos consecutivos
resilience4j.circuitbreaker.instances.stripe.sliding-window-size=5
resilience4j.circuitbreaker.instances.stripe.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.stripe.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.stripe.permitted-number-of-calls-in-half-open-state=2

resilience4j.circuitbreaker.instances.onvo.sliding-window-size=5
resilience4j.circuitbreaker.instances.onvo.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.onvo.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.onvo.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.onvo.ignore-exceptions=java.lang.IllegalStateException

resilience4j.circuitbreaker.instances.tilopay.sliding-window-size=5
resilience4j.circuitbreaker.instances.tilopay.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.tilopay.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.tilopay.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.tilopay.ignore-exceptions=java.lang.IllegalStateException

resilience4j.circuitbreaker.instances.hacienda.sliding-window-size=5
resilience4j.circuitbreaker.instances.hacienda.failure-rate-threshold=80
resilience4j.circuitbreaker.instances.hacienda.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.hacienda.record-exceptions=com.hotclick.service.hacienda.HaciendaTransitoriaException
resilience4j.circuitbreaker.instances.hacienda.ignore-exceptions=com.hotclick.service.hacienda.HaciendaConfiguracionException

resilience4j.circuitbreaker.instances.claude.sliding-window-size=10
resilience4j.circuitbreaker.instances.claude.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.claude.wait-duration-in-open-state=15s

resilience4j.circuitbreaker.instances.s3.sliding-window-size=5
resilience4j.circuitbreaker.instances.s3.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.s3.wait-duration-in-open-state=30s
# FULL-01: un rechazo de validación de imagen no cuenta como falla de S3.
resilience4j.circuitbreaker.instances.s3.ignore-exceptions=java.lang.IllegalArgumentException,com.hotclick.exception.ImagenOcupadaException

# Scraping (ExtraccionService → Amazon/eBay/Walmart/Newegg/DuckDuckGo): umbral más
# tolerante porque el bloqueo de bots en estos sitios es frecuente y esperado;
# el circuito corta rápido para no demorar la creación de producto con timeouts muertos.
resilience4j.circuitbreaker.instances.scraping.sliding-window-size=10
resilience4j.circuitbreaker.instances.scraping.failure-rate-threshold=70
resilience4j.circuitbreaker.instances.scraping.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.scraping.permitted-number-of-calls-in-half-open-state=3

# Retry: 3 intentos con backoff exponencial
resilience4j.retry.instances.stripe.max-attempts=3
resilience4j.retry.instances.stripe.wait-duration=1s
resilience4j.retry.instances.stripe.enable-exponential-backoff=true
resilience4j.retry.instances.stripe.exponential-backoff-multiplier=2

resilience4j.retry.instances.onvo.max-attempts=3
resilience4j.retry.instances.onvo.wait-duration=1s
resilience4j.retry.instances.onvo.enable-exponential-backoff=true
resilience4j.retry.instances.onvo.exponential-backoff-multiplier=2
resilience4j.retry.instances.onvo.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException

resilience4j.retry.instances.tilopay.max-attempts=3
resilience4j.retry.instances.tilopay.wait-duration=1s
resilience4j.retry.instances.tilopay.enable-exponential-backoff=true
resilience4j.retry.instances.tilopay.exponential-backoff-multiplier=2
resilience4j.retry.instances.tilopay.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException

resilience4j.retry.instances.hacienda.max-attempts=3
resilience4j.retry.instances.hacienda.wait-duration=2s
resilience4j.retry.instances.hacienda.enable-exponential-backoff=true
resilience4j.retry.instances.hacienda.exponential-backoff-multiplier=2
resilience4j.retry.instances.hacienda.retry-exceptions=com.hotclick.service.hacienda.HaciendaTransitoriaException
resilience4j.retry.instances.hacienda.ignore-exceptions=com.hotclick.service.hacienda.HaciendaConfiguracionException

resilience4j.retry.instances.claude.max-attempts=2
resilience4j.retry.instances.claude.wait-duration=500ms

resilience4j.retry.instances.s3.max-attempts=2
resilience4j.retry.instances.s3.wait-duration=1s
# FULL-01: no reintentar (ni re-decodificar) una imagen rechazada por validación.
resilience4j.retry.instances.s3.ignore-exceptions=java.lang.IllegalArgumentException,com.hotclick.exception.ImagenOcupadaException

# Scraping: solo 2 intentos — cada timeout ya es 8-12s, más reintentos demoran
# demasiado la creación de producto sin mejorar la tasa de éxito.
resilience4j.retry.instances.scraping.max-attempts=2
resilience4j.retry.instances.scraping.wait-duration=1s
resilience4j.retry.instances.scraping.enable-exponential-backoff=true
resilience4j.retry.instances.scraping.exponential-backoff-multiplier=2

# F29 — MICROMETER métricas de llamadas externas
