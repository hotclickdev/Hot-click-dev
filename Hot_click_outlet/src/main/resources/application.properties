# ====================================================
# SERVER
# ====================================================
server.port=${PORT:8080}
# Render corre detrás de un proxy/load balancer —
# esto permite leer X-Forwarded-For, X-Forwarded-Proto correctamente
server.forward-headers-strategy=FRAMEWORK
spring.application.name=Hot_click_outlet

# ====================================================
# DATASOURCE — Supabase PostgreSQL (Transaction Pooler)
# ====================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari — ajustado al límite de Supabase free tier (max 5 conexiones simultáneas)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000

# ====================================================
# JPA / HIBERNATE
# ====================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ====================================================
# LOGGING — Producción
# ====================================================
spring.output.ansi.enabled=NEVER
logging.level.root=WARN
logging.level.com.hotclick=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=WARN

# ====================================================
# JWT
# ====================================================
jwt.secret=${JWT_SECRET}

# ====================================================
# CORS
# ====================================================
cors.allowed.origins=${CORS_ALLOWED_ORIGINS}

# ====================================================
# SMTP — Gmail
# ====================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:hotclick.cr@gmail.com}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ====================================================
# SUPABASE STORAGE
# ====================================================
supabase.url=${SUPABASE_URL:https://nkevwfcjhjaawtdqquns.supabase.co}
supabase.service-key=${SUPABASE_SERVICE_KEY}

# Multipart — imágenes hasta 5 MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ====================================================
# PAYXPERT
# ====================================================
payxpert.api.url=https://connect2.payxpert.com
payxpert.originator.id=${PAYXPERT_ORIGINATOR_ID}
payxpert.originator.password=${PAYXPERT_ORIGINATOR_PASSWORD}
payxpert.callback.url=${APP_URL}/api/webhooks/payxpert
payxpert.redirect.success.url=${APP_URL}/pago/exito
payxpert.redirect.cancel.url=${APP_URL}/pago/cancelado
payxpert.payment.ttl.minutes=30

# ====================================================
# PAYPAL
# ====================================================
# Sandbox: https://api-m.sandbox.paypal.com
# Producción: https://api-m.paypal.com
paypal.api.url=${PAYPAL_API_URL:https://api-m.sandbox.paypal.com}
paypal.client.id=${PAYPAL_CLIENT_ID}
paypal.client.secret=${PAYPAL_CLIENT_SECRET}
# ID del webhook creado en PayPal Developer Dashboard (para validar firmas)
paypal.webhook.id=${PAYPAL_WEBHOOK_ID:}

# ====================================================
# MÓDULO PUBLICACIÓN AUTOMATIZADA
# ====================================================
google.vision.api-key=${GOOGLE_VISION_API_KEY}
app.tc.usd.fallback=530
app.publication.enabled=true
app.publication.interval-minutes=30
