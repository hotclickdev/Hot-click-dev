twilio.from-number=${TWILIO_FROM_NUMBER:}


# ====================================================
# SEGURIDAD — email de destino para alertas CRITICAL/HIGH
# ====================================================
security.alert.email=${SECURITY_ALERT_EMAIL:hotclick.cr@gmail.com}

# ====================================================
# SOPORTE — email de destino para tickets de "Ayuda" (Sistema EMPRENDEDOR)
# ====================================================
soporte.tickets.email=${SOPORTE_TICKETS_EMAIL:hotclick.cr@gmail.com}

# ====================================================
# ABUSEIPDB — reputación de IPs en logins
