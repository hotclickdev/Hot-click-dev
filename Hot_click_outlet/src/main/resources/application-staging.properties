# Perfil staging: base vacía con Flyway completo e integraciones externas apagadas o simuladas.
# STAGING_JWT_SECRET y STAGING_AUTH_ENABLED NUNCA van en el .env de producción (la app no arranca).
spring.datasource.url=${STAGING_DB_URL}
spring.datasource.username=${STAGING_DB_USERNAME}
spring.datasource.password=${STAGING_DB_PASSWORD}
spring.flyway.enabled=true
# Baseline solo en staging: la versión sale de STAGING_FLYWAY_BASELINE (esquema de qa/staging/schema-baseline.sql).
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=${STAGING_FLYWAY_BASELINE}
spring.flyway.clean-disabled=true

# ONVO en modo simulado (sin llave = mock). Tilopay sale en #152: sin configuración aquí.
onvo.secret-key=
onvo.webhook-secret=
onvo.publishable-key=
# Correo, Telegram, Sentry y Turnstile apagados
spring.mail.host=
telegram.bot-token=
telegram.chat-id=
telegram.client.bot-token=
telegram.client.webhook-secret=
sentry.dsn=
sentry.environment=staging
turnstile.secret.key=
