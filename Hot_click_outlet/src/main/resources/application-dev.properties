# ====================================================
# Perfil DEV — Postgres local (docker-compose.dev.yml)
# ====================================================
# Arranque: -Dspring-boot.run.profiles=dev
#
# V1..VN NO se rejugan en cadena en base vacía (V1 es dump legacy / baseline en prod).
# FlywayRepairConfig detecta la última V{N}__*.sql del classpath y hace baseline ahí
# + tablas nativas; Hibernate arma el esquema. Una base ya inicializada sí aplica
# migraciones nuevas (ALTER sobre tablas que Hibernate ya creó).
#
# El guardrail en FlywayRepairConfig aborta si el host no es local.

spring.datasource.url=jdbc:postgresql://localhost:5432/hotclick_dev
spring.datasource.username=hotclick_dev
spring.datasource.password=hotclick_dev

# JWT de desarrollo — 64+ chars para no disparar CRITICAL en ProductionConfigValidator.
# No es un secreto real; solo para firmas locales.
jwt.secret=hotclick-dev-jwt-secret-local-only-never-use-in-prod-64chars-min

# Fallback si Spring llama baseline fuera de bootstrapDevVacio; el bootstrap vacío
# pisa este valor con la última V del classpath (hoy V140+).
spring.flyway.baseline-version=136
spring.flyway.baseline-description=Dev empty-DB bootstrap (V1-VN not replayable; overridden at runtime)

# Esquema de entidades: Hibernate completa lo que el baseline no trae
spring.jpa.hibernate.ddl-auto=update

# Catálogo demo (CatalogoLocalSeeder)
hotclick.seed.catalogo-local=true

# Visibilidad en desarrollo
spring.jpa.show-sql=true
logging.level.com.hotclick=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# No ensuciar Sentry de producción
sentry.dsn=
sentry.environment=development

# App local
# QA7-C1: el front de dev corre en :3000 (vite); los retornos de pago van ahí. Staging debe exportar APP_URL con su URL pública.
app.url=${APP_URL:http://localhost:3000}
cors.allowed.origins=http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://localhost:5173

# Schedulers ruidosos apagados en local (opcional; se pueden reactivar)
app.abandoned-cart.enabled=false
app.publication.enabled=false

# ONVO en el checkout publico solo en dev (decision del dueno, 21-oct-2026). Produccion sigue en false
# hasta que se cambie PAYMENTS_ONVO_ENABLED en el .env del servidor. Sin ONVO_SECRET_KEY, la tarjeta responde error.
payments.onvo.enabled=true

# Precios mensuales USD para desarrollo local (supuesto 9/24/49, pendiente de confirmar por HOT_CLICK).
hotclick.planes.moneda=usd
hotclick.planes.emprendedor.precio-mensual-usd=9
hotclick.planes.pyme.precio-mensual-usd=24
hotclick.planes.negocio-plus.precio-mensual-usd=49

# Vaciado de plataforma al arrancar (ResetPlataformaKeepQaRunner). Apagado por defecto: borra tiendas y
# productos en cada arranque. Opt-in explícito solo en una BD local descartable:
#   HOTCLICK_RESETPLATAFORMA_ENABLED=true (o -Dhotclick.reset-plataforma.enabled=true)
hotclick.reset-plataforma.enabled=false

# Cuentas demo @hotclick.test: plan gratis sin puesto ni correo verificado. Solo dev/test con este flag explícito;
# CupoEmprendedorService lo ignora con prod/production o cualquier otro perfil (fail-closed). Nunca ponerlo en prod.
hotclick.cupo-emprendedor.demo-correo-habilitado=true

# Correo: dev no usa credenciales reales de SendGrid; noop solo loguea destinatario enmascarado y asunto.
mail.provider=${MAIL_PROVIDER:noop}
