# Nginx reverse proxy — hotclick.lat (EC2 producción)
# Con Cloudflare: ver deploy/cloudflare/SETUP.md
# Aplicar: Hot_click_outlet/deploy/ec2/apply-nginx.sh

include /etc/nginx/conf.d/cloudflare-real-ip.conf;

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name hotclick.lat www.hotclick.lat;

    # Certbot challenge (si se usa Let's Encrypt en lugar de Origin Certificate)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — terminación TLS en Nginx, proxy a Spring Boot en localhost:8080
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hotclick.lat www.hotclick.lat;

    # Origin Certificate Cloudflare (install-origin-cert.sh) o Let's Encrypt por defecto
    include /etc/nginx/conf.d/hotclick-ssl.conf;

    include /etc/nginx/conf.d/ssl-params.conf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
