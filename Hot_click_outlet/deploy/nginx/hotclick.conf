# Nginx reverse proxy — hotclick.lat (EC2 producción)
# Copiar a /etc/nginx/conf.d/hotclick.conf y recargar nginx.
# Ver: Hot_click_outlet/deploy/ec2/apply-nginx.sh

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name hotclick.lat www.hotclick.lat;

    # Certbot challenge (renovación automática)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — terminación TLS en Nginx, proxy a Spring Boot en localhost:8080
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hotclick.lat www.hotclick.lat;

    ssl_certificate     /etc/letsencrypt/live/hotclick.lat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hotclick.lat/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.conf;

    # Headers de seguridad en el edge (refuerzo; Spring también los envía)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Límite de upload alineado con Spring (30 MB catálogos PDF)
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # SSE / AI copilot streams
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
