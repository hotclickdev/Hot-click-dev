# Lightsail 4 GB (Ohio) — app + Postgres en Docker. Producción desde el 24 sep 2026.
# No usar en la EC2 apagada: ese host sigue con docker-compose.prod.yml + RDS.
#
# RAM aproximada: Postgres 768 MB + JVM 1.5 GB + OS/Nginx/Docker ~1.5 GB.
# Sin sidecar de guardrails (el copilot ya no lo usa).

services:
  postgres:
    image: postgres:18-alpine
    container_name: hotclick-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hotclick}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - hotclick_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build: .
    image: hot_click_outlet-app
    container_name: hotclick
    env_file: .env
    # Planes y precios ONVO: sin default a propósito (los valores salen del .env del servidor).
    environment:
      # Perfil fijo de producción (debe escribirse exactamente "prod").
      SPRING_PROFILES_ACTIVE: prod
      PLANES_MONEDA: ${PLANES_MONEDA:?falta PLANES_MONEDA}
      ONVO_PRICE_ID_PYME: ${ONVO_PRICE_ID_PYME:?falta ONVO_PRICE_ID_PYME}
      ONVO_PRICE_ID_NEGOCIO_PLUS: ${ONVO_PRICE_ID_NEGOCIO_PLUS:?falta ONVO_PRICE_ID_NEGOCIO_PLUS}
      EMPRENDEDOR_PRECIO_MENSUAL_USD: ${EMPRENDEDOR_PRECIO_MENSUAL_USD:?falta EMPRENDEDOR_PRECIO_MENSUAL_USD}
      PYME_PRECIO_MENSUAL_USD: ${PYME_PRECIO_MENSUAL_USD:?falta PYME_PRECIO_MENSUAL_USD}
      NEGOCIO_PLUS_PRECIO_MENSUAL_USD: ${NEGOCIO_PLUS_PRECIO_MENSUAL_USD:?falta NEGOCIO_PLUS_PRECIO_MENSUAL_USD}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - java
      - -Xms512m
      - -Xmx1536m
      - -XX:+UseG1GC
      - -jar
      - app.jar
    restart: unless-stopped
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  hotclick_pgdata:
    name: hotclick_pgdata
