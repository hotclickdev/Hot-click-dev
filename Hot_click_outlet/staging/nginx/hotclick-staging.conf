# Nginx de STAGING. Copiar a /etc/nginx/conf.d/hotclick-staging.conf y
# cambiar staging.example.invalid por el dominio real de staging.
# client_max_body_size = 30m, igual que spring.servlet.multipart.max-request-size (30MB) en prod.
server {
    listen 80;
    server_name staging.example.invalid;
    client_max_body_size 30m;

    # Staging no se indexa.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
# HTTPS: correr `sudo certbot --nginx -d <dominio-staging>` (agrega el bloque 443).
