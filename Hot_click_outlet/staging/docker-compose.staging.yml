# HotClick STAGING — segundo servidor Lightsail, copia de prod con datos de prueba.
# Proyecto separado (hotclick-staging): contenedores y volumen propios.
# Uso: docker compose -p hotclick-staging -f staging/docker-compose.staging.yml --env-file staging/.env.staging up -d
services:
  postgres:
    image: postgres:18-alpine
    container_name: hotclick-staging-postgres
    restart: unless-stopped
    env_file: .env.staging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hotclick_staging}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - hotclick_staging_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    mem_limit: 512m

  app:
    build: ..
    image: hot_click_outlet-staging
    container_name: hotclick-staging
    env_file: .env.staging
    # Solo localhost: Nginx publica 80/443.
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["java", "-Xms256m", "-Xmx1024m", "-XX:+UseG1GC", "-jar", "app.jar"]
    restart: unless-stopped
    mem_limit: 1400m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hotclick_staging_pgdata:
    name: hotclick_staging_pgdata
