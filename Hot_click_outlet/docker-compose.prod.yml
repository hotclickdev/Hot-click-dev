# Stack de la EC2 hotclick-app (Stopped desde el 24 sep 2026) + RDS.
# Producción viva: docker-compose.lightsail.yml en 18.119.201.126. No levantar este archivo ahí.
services:
  app:
    build: .
    container_name: hotclick
    env_file: .env
    # Planes y precios ONVO: sin default a propósito (los valores salen del .env del servidor).
    environment:
      PLANES_MONEDA: ${PLANES_MONEDA:-}
      ONVO_PRICE_ID_PYME: ${ONVO_PRICE_ID_PYME:-}
      ONVO_PRICE_ID_NEGOCIO_PLUS: ${ONVO_PRICE_ID_NEGOCIO_PLUS:-}
      EMPRENDEDOR_PRECIO_MENSUAL_USD: ${EMPRENDEDOR_PRECIO_MENSUAL_USD:-}
      PYME_PRECIO_MENSUAL_USD: ${PYME_PRECIO_MENSUAL_USD:-}
      NEGOCIO_PLUS_PRECIO_MENSUAL_USD: ${NEGOCIO_PLUS_PRECIO_MENSUAL_USD:-}
    ports:
      - "8080:8080"
    # Sin "dns:" propio — el DNS por defecto de Docker reenvía al resolver de
    # la VPC (Amazon-provided DNS), que es el único que resuelve el hostname
    # de RDS a su IP privada. Forzar 8.8.8.8/8.8.4.4 acá rompe la conexión a
    # la base de datos (confirmado: timeout de conexión con ese override).
    depends_on:
      - guardrails
    restart: unless-stopped

  guardrails:
    build: ../security-tools/guardrails
    container_name: hotclick-guardrails
    env_file: .env
    # Sin "ports": — solo accesible en la red interna de compose (app → guardrails),
    # nunca expuesto al host/internet.
    restart: unless-stopped
