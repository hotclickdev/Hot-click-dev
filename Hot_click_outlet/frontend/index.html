        <p>HOTCLICK es el marketplace costarricense donde encontrás miles de productos únicos de emprendedores locales: tecnología, ropa, calzado, accesorios, artículos del hogar y mucho más. Envío a todo Costa Rica, pagos seguros con SINPE Móvil, Visa y Mastercard, y soporte local por WhatsApp.</p>

        <p>Sí, enviamos a todas las provincias de Costa Rica: San José, Alajuela, Heredia, Cartago, Puntarenas, Limón y Guanacaste. El tiempo de entrega es de 1 a 5 días hábiles según la zona.</p>
        <h3>¿Puedo devolver un producto?</h3>
        <p>Sí, tenemos política de devoluciones. Si el producto llegó dañado o no coincide con la descripción, contáctanos dentro de los 7 días de recibido.</p>
        <a href="/devoluciones">Ver política de devoluciones completa</a>
