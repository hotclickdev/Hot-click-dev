name: E14 — Hotfix extra check

# DISABLED 2026-09-14 — awaiting reorg
on:
  workflow_dispatch:
# ORIGINAL TRIGGERS (restore to re-enable):
# on:
#   pull_request:
#     branches: [master]
#   workflow_dispatch:

concurrency:
  group: hotfix-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: read

jobs:
  hotfix:
    name: E14 Hotfix extra check
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: No-op (no es PR hotfix/*)
        if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'hotfix/')
        run: echo "E14 PASS — no es PR hotfix/*. Job presente para no romper auto-merge de ci.yml."

      - name: Checkout
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'hotfix/')
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'hotfix/')
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: gitleaks detect (hotfix)
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'hotfix/')
        run: |
          set -euo pipefail
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          export GITLEAKS_BIN=./gitleaks
          export BASE_SHA="${{ github.event.pull_request.base.sha }}"
          export HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          export GITHUB_EVENT_NAME="${{ github.event_name }}"
          bash scripts/eng-gates/gitleaks-scan.sh

      - name: Issue outage/prod-errors + labels
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'hotfix/')
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONCLUSION: success
        run: node scripts/eng-gates/hotfix-gate.mjs
