name: S8 — Weekly restore drill

on:
  schedule:
    # Domingo 02:00 America/Costa_Rica = 08:00 UTC (después del timer del server 05:30 UTC)
    - cron: '0 8 * * 0'
  workflow_dispatch:
    inputs:
      use_fixture:
        description: 'Usar fixture sintético del repo (no prod). Para probar el mecanismo.'
        type: boolean
        default: false

concurrency:
  group: restore-drill
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  restore-drill:
    name: S8 Restore throwaway Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        # Misma versión mayor que prod (postgres:18) + pgvector (V62 crea la extensión vector).
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: drill
          POSTGRES_PASSWORD: drill_local_only
          POSTGRES_DB: restore_drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drill -d restore_drill"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      # Destino SOLO local (service throwaway). Nunca una URL de prod.
      DATABASE_URL: postgresql://drill:drill_local_only@127.0.0.1:5432/restore_drill
      DRILL_ALLOW_RESTORE: '1'
      PGPASSWORD: drill_local_only
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Instalar age y cliente Postgres 18
        run: bash scripts/eng-gates/install-pg18-client.sh

      - name: Obtener dump (S3 cifrado o fixture)
        id: dump
        env:
          USE_FIXTURE: ${{ github.event.inputs.use_fixture || 'false' }}
          BACKUP_S3_URI: ${{ vars.BACKUP_S3_URI }}
          AWS_DEFAULT_REGION: ${{ vars.BACKUP_AWS_REGION || 'us-east-2' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_READ_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_READ_AWS_SECRET_ACCESS_KEY }}
          BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
          # El drill semanal mira hasta 8 días atrás (el diario D5 exige 26 h).
          MAX_AGE_HOURS: '192'
        run: bash scripts/eng-gates/fetch-backup-dump.sh

      - name: Restore drill (throwaway) + conteo de filas
        env:
          DUMP_FILE: ${{ steps.dump.outputs.file }}
          DRILL_REQUIRE_ROWS: ${{ steps.dump.outputs.source != 'fixture' && '1' || '0' }}
        run: bash scripts/eng-gates/restore-drill.sh drill "$DUMP_FILE"

      - name: Borrar el dump descifrado
        if: always()
        run: rm -rf "$RUNNER_TEMP/backup-offsite"

  open-p0:
    name: S8 Issue P0 si el restore falla
    if: failure()
    needs: [restore-drill]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Abrir / actualizar Issue P0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/eng-gates/restore-drill-issue.mjs

      - name: Aviso Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEXTO: "❌ S8 restore drill FALLÓ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: bash scripts/eng-gates/telegram-aviso.sh "$TEXTO"
