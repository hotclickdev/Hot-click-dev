name: CI — Tests y Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  backend:
    name: Tests Java
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Java 21
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup Maven
        run: sudo apt-get install -y maven --quiet

      - name: Run tests
        run: mvn test --no-transfer-progress -f Hot_click_outlet/pom.xml
        env:
          DB_URL: jdbc:h2:mem:testdb
          DB_USERNAME: sa
          DB_PASSWORD: ""
          JWT_SECRET: test-secret-for-ci-only-not-production
          SENTRY_DSN: ""
          STRIPE_SECRET_KEY: ci-mock-not-a-stripe-key
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          SENDGRID_API_KEY: placeholder
          AWS_ACCESS_KEY_ID: placeholder
          AWS_SECRET_ACCESS_KEY: placeholder

  frontend:
    name: Build React
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.2

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: Hot_click_outlet/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: Hot_click_outlet/frontend

      - name: Unit tests (Vitest)
        run: pnpm test
        working-directory: Hot_click_outlet/frontend

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps
        working-directory: Hot_click_outlet/frontend

      - name: E2E tests (Playwright)
        run: pnpm test:e2e:ci
        working-directory: Hot_click_outlet/frontend
        env:
          CI: "true"

      - name: Build
        run: pnpm build
        working-directory: Hot_click_outlet/frontend
        env:
          VITE_SENTRY_DSN: ""
          VITE_APP_RELEASE: ${{ github.sha }}
          VITE_POSTHOG_PROJECT_TOKEN: ""
          VITE_POSTHOG_HOST: "https://us.i.posthog.com"
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
          VITE_STRIPE_PUBLIC_KEY: pk_test_placeholder

  hotfix-gate:
    name: E14 Hotfix extra check
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: No-op (no es PR hotfix/*)
        if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'hotfix/')
        run: echo "E14 PASS no-op — no es hotfix/*. Job siempre corre para que auto-merge no se salte en silencio."

      - name: Checkout
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'hotfix/')
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'hotfix/')
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: gitleaks detect (hotfix)
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'hotfix/')
        run: |
          set -euo pipefail
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1 --verbose

      - name: Issue outage/prod-errors + bloquear auto-merge si falta
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'hotfix/')
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONCLUSION: success
        run: node scripts/eng-gates/hotfix-gate.mjs

  auto-merge:
    name: Auto-merge si CI pasa (hotfix)
    runs-on: ubuntu-latest
    needs: [backend, frontend, hotfix-gate]
    if: success() && startsWith(github.head_ref, 'hotfix/')

    steps:
      - name: Merge PR automáticamente
        run: |
          PR_NUMBER=$(gh pr list --head "${{ github.head_ref }}" --json number -q '.[0].number')
          if [ -n "$PR_NUMBER" ]; then
            gh pr merge "$PR_NUMBER" --squash --auto --delete-branch
            MESSAGE=$(printf '%s\n' \
              "✅ *Fix deployado automáticamente*" \
              "*PR:* #${PR_NUMBER} mergeado a master" \
              "*Rama:* ${{ github.head_ref }}" \
              "*CI:* Todos los tests pasaron")
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d text="$MESSAGE" \
              -d parse_mode="Markdown"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-failure:
    name: Notificar fallo en Telegram
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: failure()

    steps:
      - name: Enviar alerta a Telegram
        run: |
          JOB_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE=$(printf '%s\n' \
            "❌ *FALLO EN CI/CD*" \
            "*Detectado por:* GitHub Actions" \
            "*Rama:* ${{ github.ref_name }}" \
            "*Autor del commit:* ${{ github.actor }}" \
            "*Commit:* \`${{ github.sha }}\`" \
            "" \
            "[Ver detalle del fallo]($JOB_URL)")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MESSAGE" \
            -d parse_mode="Markdown"
