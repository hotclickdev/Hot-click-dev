name: CI — Tests y Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  backend:
    name: Tests Java
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup Maven
        run: sudo apt-get install -y maven --quiet

      - name: Run tests
        run: mvn test --no-transfer-progress -f Hot_click_outlet/pom.xml
        env:
          DB_URL: jdbc:h2:mem:testdb
          DB_USERNAME: sa
          DB_PASSWORD: ""
          JWT_SECRET: test-secret-for-ci-only-not-production
          SENTRY_DSN: ""
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          SENDGRID_API_KEY: placeholder
          AWS_ACCESS_KEY_ID: placeholder
          AWS_SECRET_ACCESS_KEY: placeholder

  frontend:
    name: Build React
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: Hot_click_outlet/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: Hot_click_outlet/frontend

      - name: Build
        run: pnpm build
        working-directory: Hot_click_outlet/frontend
        env:
          VITE_SENTRY_DSN: ""
          VITE_POSTHOG_PROJECT_TOKEN: ""
          VITE_POSTHOG_HOST: "https://us.i.posthog.com"
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
          VITE_STRIPE_PUBLIC_KEY: pk_test_placeholder

  auto-merge:
    name: Auto-merge si CI pasa (hotfix)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: success() && startsWith(github.head_ref, 'hotfix/')

    steps:
      - name: Merge PR automáticamente
        run: |
          PR_NUMBER=$(gh pr list --head "${{ github.head_ref }}" --json number -q '.[0].number')
          if [ -n "$PR_NUMBER" ]; then
            gh pr merge "$PR_NUMBER" --squash --auto --delete-branch
            MESSAGE="✅ *Fix deployado automáticamente*

*PR:* #$PR_NUMBER mergeado a master
*Rama:* ${{ github.head_ref }}
*CI:* Todos los tests pasaron"
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d text="$MESSAGE" \
              -d parse_mode="Markdown"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-failure:
    name: Notificar fallo en Telegram
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: failure()

    steps:
      - name: Enviar alerta a Telegram
        run: |
          JOB_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE="❌ *FALLO EN CI/CD*

*Detectado por:* GitHub Actions
*Rama:* ${{ github.ref_name }}
*Autor del commit:* ${{ github.actor }}
*Commit:* \`${{ github.sha }}\`

[Ver detalle del fallo]($JOB_URL)"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MESSAGE" \
            -d parse_mode="Markdown"
