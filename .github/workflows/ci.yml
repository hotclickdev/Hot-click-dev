name: CI — Tests y Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  backend:
    name: Tests Java
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Java 21
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup Maven
        run: sudo apt-get install -y maven --quiet

      - name: Run tests
        run: mvn test --no-transfer-progress -f Hot_click_outlet/pom.xml
        env:
          DB_URL: jdbc:h2:mem:testdb
          DB_USERNAME: sa
          DB_PASSWORD: ""
          JWT_SECRET: test-secret-for-ci-only-not-production
          SENTRY_DSN: ""
          STRIPE_SECRET_KEY: ci-mock-not-a-stripe-key
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          SENDGRID_API_KEY: placeholder
          AWS_ACCESS_KEY_ID: placeholder
          AWS_SECRET_ACCESS_KEY: placeholder
          HOTCLICK_NUMEROS_PROHIBIDOS: ${{ secrets.HOTCLICK_NUMEROS_PROHIBIDOS }}

  qa-alta-pg:
    name: QA alta Postgres (tx abortada)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: hotclick_qa_alta
          POSTGRES_USER: hotclick_qa
          POSTGRES_PASSWORD: hotclick_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotclick_qa -d hotclick_qa_alta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Java 21
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup Maven
        run: sudo apt-get install -y maven --quiet

      - name: QaAltaPymeTestPostgresTest
        run: mvn -f Hot_click_outlet/pom.xml -Dtest=QaAltaPymeTestPostgresTest test --no-transfer-progress
        env:
          HC_PG_TEST_URL: jdbc:postgresql://127.0.0.1:5432/hotclick_qa_alta?user=hotclick_qa&password=hotclick_qa

      - name: "Gate: el test corrio y no quedo skipped"
        if: always()
        run: python3 scripts/ci/qa-alta-pg-surefire.py Hot_click_outlet/target/surefire-reports/TEST-com.hotclick.service.QaAltaPymeTestPostgresTest.xml

      - name: Reporte Surefire (sin secretos)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-alta-pg-surefire
          path: Hot_click_outlet/target/surefire-reports/TEST-com.hotclick.service.QaAltaPymeTestPostgresTest.xml
          if-no-files-found: error

  onvo-alta-pg:
    name: ONVO alta Postgres (marketplace y ledger)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: hotclick_qa_alta
          POSTGRES_USER: hotclick_qa
          POSTGRES_PASSWORD: hotclick_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotclick_qa -d hotclick_qa_alta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Java 21
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup Maven
        run: sudo apt-get install -y maven --quiet

      - name: "Self-test del gate de planes (XML ausente/vacio/skipped/fallo/obsoleto/valido)"
        run: python3 -m unittest scripts/ci/test_planes_snapshot_pg_surefire.py

      - name: "Marca de inicio (reportes de esta corrida, no viejos)"
        run: |
          rm -f Hot_click_outlet/target/surefire-reports/TEST-com.hotclick.service.suscripcion.PlanesActivosSnapshotPostgresTest.xml
          touch "$RUNNER_TEMP/planes-pg-inicio"

      - name: OnvoAltaMarketplacePostgresTest + PlanesActivosSnapshotPostgresTest
        run: mvn -f Hot_click_outlet/pom.xml -Dtest=OnvoAltaMarketplacePostgresTest,PlanesActivosSnapshotPostgresTest test --no-transfer-progress
        env:
          HC_PG_TEST_URL: jdbc:postgresql://127.0.0.1:5432/hotclick_qa_alta?user=hotclick_qa&password=hotclick_qa

      - name: "Gate: el test corrio y no quedo skipped"
        if: always()
        run: python3 scripts/ci/onvo-alta-pg-surefire.py Hot_click_outlet/target/surefire-reports/TEST-com.hotclick.integration.OnvoAltaMarketplacePostgresTest.xml

      - name: "Gate: snapshot de planes corrio en Postgres (suite, fresco, 0 skipped/fallos/errores)"
        if: always()
        run: python3 scripts/ci/planes-snapshot-pg-surefire.py Hot_click_outlet/target/surefire-reports/TEST-com.hotclick.service.suscripcion.PlanesActivosSnapshotPostgresTest.xml "$RUNNER_TEMP/planes-pg-inicio"

      - name: Reporte Surefire (sin secretos)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: onvo-alta-pg-surefire
          path: |
            Hot_click_outlet/target/surefire-reports/TEST-com.hotclick.integration.OnvoAltaMarketplacePostgresTest.xml
            Hot_click_outlet/target/surefire-reports/TEST-com.hotclick.service.suscripcion.PlanesActivosSnapshotPostgresTest.xml
          if-no-files-found: error

  frontend:
    name: Build React
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.2

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: Hot_click_outlet/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: Hot_click_outlet/frontend

      - name: Unit tests (Vitest)
        run: pnpm test
        working-directory: Hot_click_outlet/frontend

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium --with-deps
        working-directory: Hot_click_outlet/frontend

      - name: E2E tests (Playwright)
        run: pnpm test:e2e:ci
        working-directory: Hot_click_outlet/frontend
        env:
          CI: "true"

      - name: Build
        run: pnpm build
        working-directory: Hot_click_outlet/frontend
        env:
          VITE_SENTRY_DSN: ""
          VITE_APP_RELEASE: ${{ github.sha }}
          VITE_POSTHOG_PROJECT_TOKEN: ""
          VITE_POSTHOG_HOST: "https://us.i.posthog.com"
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
          VITE_STRIPE_PUBLIC_KEY: pk_test_placeholder

  hotfix-gate:
    name: E14 Hotfix extra check
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: No-op (no es PR hotfix/*)
        if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'hotfix/')
        run: echo "E14 PASS no-op — no es hotfix/*. Job siempre corre (gate E14)."

      - name: Checkout
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'hotfix/')
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'hotfix/')
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: gitleaks detect (hotfix)
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'hotfix/')
        run: |
          set -euo pipefail
          # -f corta en HTTP de error; --retry evita un corte de red a medias.
          # Content-Length del response final debe cuadrar con el archivo (falla claro si viene incompleto).
          curl -fsSL --retry 3 --retry-delay 5 \
            -D gitleaks.hdr \
            -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          expected=$(awk 'BEGIN{IGNORECASE=1} tolower($1)=="content-length:"{v=$2} END{print v}' gitleaks.hdr | tr -d '\r')
          actual=$(wc -c < gitleaks.tar.gz | tr -d ' ')
          if [ -z "$expected" ] || [ "$expected" = "0" ]; then
            echo "Descarga de gitleaks sin Content-Length usable (headers en gitleaks.hdr)" >&2
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "Descarga incompleta de gitleaks: bytes=$actual esperado=$expected" >&2
            exit 1
          fi
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          export GITLEAKS_BIN=./gitleaks
          export BASE_SHA="${{ github.event.pull_request.base.sha }}"
          export HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          export GITHUB_EVENT_NAME="${{ github.event_name }}"
          bash scripts/eng-gates/gitleaks-scan.sh

      - name: Issue outage/prod-errors (gate hotfix)
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'hotfix/')
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONCLUSION: success
        run: node scripts/eng-gates/hotfix-gate.mjs

  notify-failure:
    name: Notificar fallo en Telegram
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: failure()

    steps:
      - name: Enviar alerta a Telegram
        run: |
          JOB_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MESSAGE=$(printf '%s\n' \
            "❌ *FALLO EN CI/CD*" \
            "*Detectado por:* GitHub Actions" \
            "*Rama:* ${{ github.ref_name }}" \
            "*Autor del commit:* ${{ github.actor }}" \
            "*Commit:* \`${{ github.sha }}\`" \
            "" \
            "[Ver detalle del fallo]($JOB_URL)")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="$MESSAGE" \
            -d parse_mode="Markdown"
