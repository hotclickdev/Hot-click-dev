name: D11 — Daily API contract drift

on:
  schedule:
    # Diario 04:15 America/Costa_Rica = 10:15 UTC
    - cron: '15 10 * * *'
    # Semanal martes 08:15 CR = 14:15 UTC
    - cron: '15 14 * * 2'
  workflow_dispatch:

concurrency:
  group: api-contract-drift
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  drift:
    name: D11 api-drift
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Comparar controllers vs services y upsert Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/eng-gates/api-contract-drift.mjs
