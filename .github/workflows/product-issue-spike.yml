name: E15 — Product issue technical spike

on:
  issues:
    types: [opened, labeled, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number (dispatch)'
        required: false

concurrency:
  group: product-issue-spike-${{ github.event.issue.number || github.event.inputs.issue_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  spike:
    name: E15 spike comment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Comentar archivos sospechosos (no implementa fix)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          ISSUE_IS_PR: ${{ github.event.issue.pull_request && 'true' || 'false' }}
        run: node scripts/eng-gates/product-issue-spike.mjs
