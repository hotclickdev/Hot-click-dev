name: D8 — Daily secrets-in-docs

# DISABLED 2026-09-14 — awaiting reorg
on:
  workflow_dispatch:
# ORIGINAL TRIGGERS (restore to re-enable):
# on:
#   schedule:
#     # 03:15 America/Costa_Rica = 09:15 UTC
#     - cron: '15 9 * * *'
#   workflow_dispatch:

concurrency:
  group: secrets-in-docs
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  scan:
    name: D8 secrets in docs
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Escanear docs (redact) y upsert Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/eng-gates/secrets-in-docs.mjs
