name: Daily DB Backup

# El backup lo hace el server (timer systemd hotclick-db-backup, 05:30 UTC):
# pg_dump -Fc dentro de Docker -> pg_restore --list -> age (clave pública) -> Google Drive (rclone).
# Este workflow es el verificador off-site: baja el último .dump.age, lo descifra y valida el TOC.
# Falla si faltan secretos, si no hay backup de las últimas 26 h o si el dump no se puede leer.
on:
  schedule:
    - cron: '30 7 * * *'  # 07:30 UTC = 01:30 Costa Rica, 2 h después del timer del server
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-offsite
  cancel-in-progress: false

jobs:
  verify-offsite:
    name: D5 — Backup off-site presente, reciente y legible
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
      GDRIVE_SHARED_DRIVE_ID: ${{ vars.GDRIVE_SHARED_DRIVE_ID }}
      # Uno de los dos modos (gdrive-rclone-env.sh): OAuth (recomendado) o service account en unidad compartida
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_RCLONE_TOKEN: ${{ secrets.GDRIVE_RCLONE_TOKEN }}
      GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
      BACKUP_AGE_IDENTITY: ${{ secrets.BACKUP_AGE_IDENTITY }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Instalar age, rclone y cliente Postgres 18
        run: bash scripts/eng-gates/install-pg18-client.sh

      - name: Bajar el último backup
        id: fetch
        run: bash scripts/eng-gates/backup-offsite.sh fetch-latest "$RUNNER_TEMP/backup"

      - name: Descifrar
        id: decrypt
        env:
          ENC: ${{ steps.fetch.outputs.file }}
        run: bash scripts/eng-gates/backup-offsite.sh decrypt "$ENC" "${ENC%.age}"

      - name: Verificar (tamaño + pg_restore --list + tablas clave)
        env:
          DUMP: ${{ steps.decrypt.outputs.dump }}
        run: bash scripts/eng-gates/backup-offsite.sh verify "$DUMP"

      - name: Borrar el dump descifrado
        if: always()
        run: rm -rf "$RUNNER_TEMP/backup"

      - name: Aviso Telegram si falla
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEXTO: "❌ D5 backup off-site FALLÓ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: bash scripts/eng-gates/telegram-aviso.sh "$TEXTO"
