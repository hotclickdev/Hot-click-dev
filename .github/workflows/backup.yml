name: Daily DB Backup

on:
  schedule:
    - cron: '0 6 * * *'  # 6 AM UTC = medianoche Costa Rica (UTC-6)
  workflow_dispatch:      # trigger manual desde GitHub Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install postgresql-client
        run: sudo apt-get install -y postgresql-client

      - name: Dump and compress
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_BACKUP_URL: ${{ secrets.SUPABASE_BACKUP_URL }}
        run: |
          FILENAME="hotclick-backup-$(date +%Y%m%d-%H%M%S).sql.gz"
          pg_dump "$SUPABASE_BACKUP_URL" \
            --no-owner --no-acl --format=plain | gzip > "$FILENAME"
          echo "BACKUP_FILE=$FILENAME" >> $GITHUB_ENV
          echo "Backup generado: $(du -sh $FILENAME)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
