name: Daily DB Backup

on:
  schedule:
    - cron: '0 6 * * *'  # 6 AM UTC = medianoche Costa Rica (UTC-6)
  workflow_dispatch:      # trigger manual desde GitHub Actions

jobs:
  backup:
    name: D5 — Dump presente y no vacío (sin artifact)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install postgresql-client
        run: sudo apt-get install -y postgresql-client

      # El dump NO se sube como artifact: GitHub nunca guarda una copia sin cifrar.
      # El respaldo real es local y cifrado: docs/infra/respaldo-pc-local.md
      - name: Dump, verificar y borrar
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_BACKUP_URL: ${{ secrets.SUPABASE_BACKUP_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WORKDIR="$(mktemp -d "$RUNNER_TEMP/d5.XXXXXX")"
          trap 'rm -rf -- "$WORKDIR"' EXIT
          FILENAME="$WORKDIR/hotclick-backup-$(date +%Y%m%d-%H%M%S).sql.gz"
          pg_dump "$SUPABASE_BACKUP_URL" \
            --no-owner --no-acl --format=plain | gzip > "$FILENAME"
          bash scripts/eng-gates/verify-backup.sh "$WORKDIR" 1024
