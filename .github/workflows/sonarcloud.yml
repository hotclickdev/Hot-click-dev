name: SonarCloud — Análisis de seguridad y calidad

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:   # Permite correrlo manualmente desde GitHub

jobs:
  sonarcloud:
    name: Escaneo SonarCloud
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0   # SonarCloud necesita el historial completo para blame/nuevo código

      # 2. Configurar Java 21
      - name: Setup Java 21
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Instalar Maven del sistema (el maven/ local es Windows-only)
      - name: Setup Maven
        run: sudo apt-get install -y maven --quiet

      # 4. Compilar Java (skip tests — solo necesitamos que compile para el escaneo)
      - name: Build Java
        run: mvn clean package -DskipTests --no-transfer-progress -f Hot_click_outlet/pom.xml
        env:
          DB_URL: jdbc:h2:mem:testdb
          DB_USERNAME: sa
          DB_PASSWORD: ""
          JWT_SECRET: test-secret-for-ci-only-not-production
          SENTRY_DSN: ""

      # 5. Escaneo SonarCloud (action unificada; la anterior está archivada)
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
