name: SonarCloud — Análisis de seguridad y calidad

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:   # Permite correrlo manualmente desde GitHub

jobs:
  sonarcloud:
    name: Escaneo SonarCloud
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del código
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0   # SonarCloud necesita el historial completo para blame/nuevo código

      # 2. Configurar Java 21
      - name: Setup Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Instalar Maven del sistema (el maven/ local es Windows-only)
      - name: Setup Maven
        run: sudo apt-get install -y maven --quiet

      # 4. Compilar Java (skip tests — solo necesitamos que compile para el escaneo)
      - name: Build Java
        run: mvn clean package -DskipTests --no-transfer-progress -f Hot_click_outlet/pom.xml
        env:
          DB_URL: jdbc:h2:mem:testdb
          DB_USERNAME: sa
          DB_PASSWORD: ""
          JWT_SECRET: test-secret-for-ci-only-not-production
          SENTRY_DSN: ""

      # 5. Escaneo SonarCloud
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ba3875ecf642b2129de2b589510c81a8b53dbf4e # master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN:  ${{ secrets.SONAR_TOKEN }}
