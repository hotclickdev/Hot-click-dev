name: D3 — Daily SPA static vs React

# DISABLED 2026-09-14 — awaiting reorg
on:
  workflow_dispatch:
# ORIGINAL TRIGGERS (restore to re-enable):
# on:
#   schedule:
#     # 02:15 America/Costa_Rica = 08:15 UTC
#     - cron: '15 8 * * *'
#   workflow_dispatch:

concurrency:
  group: spa-stale
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  stale:
    name: D3 spa-stale
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Comparar frontend/src vs static/
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/eng-gates/spa-stale.mjs
