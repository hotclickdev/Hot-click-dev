# PLANTILLA NO INSTALADA. Caller en el PR: job e4 (reusable de confianza) + job de tests SIN
# privilegios (Maven/pnpm del head; nunca es el verificador). Su blob exacto se fija en la
# política (caller.blob); cualquier edición o renombre => origen inválido o check de tests ausente
# (testsCheckName) => rojo en el cierre. El job de tests depende de e4 (plan de D) y no recibe token.
# caed9945fdfe50d2326d7fbcd770c7ac93d5306a sin sustituir hace que GitHub rechace el workflow (fail-closed): `uses` no admite expresiones.
name: E4 — Commit-gate (r4 fase A)
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
jobs:
  e4:
    name: E4 Commit-gate VEREDICTO (r4 fase A)
    uses: hotclickdev/Hot-click-dev/.github/workflows/e4-trusted.yml@caed9945fdfe50d2326d7fbcd770c7ac93d5306a
  tests:
    name: E4 tests tocados (r4 fase A)   # = policy.testsCheckName (nombre de prueba; no sustituye el caller definitivo)
    needs: e4
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions: {}
    env:
      JAVA_TESTS: ${{ needs.e4.outputs.java_tests }}
      RUN_FE: ${{ needs.e4.outputs.fe }}
    # C3 PENDIENTE (no implementado): este job NO instala Java ni Node; antes de quitar FIXED_BLOCK hay que añadir
    # setup-java y setup-node fijados por SHA (y Maven/corepack reproducibles). Hoy mvn/pnpm no existirían en el runner.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: { ref: "${{ github.event.pull_request.head.sha }}", persist-credentials: false }
      - name: tests tocados (código del head, sin token ni secretos)
        run: |
          set -euo pipefail
          if [ -n "$JAVA_TESTS" ]; then (cd Hot_click_outlet && ../maven/bin/mvn -B -q -Dtest="$JAVA_TESTS" -Dsurefire.failIfNoSpecifiedTests=true test); fi
          if [ "$RUN_FE" = "true" ]; then (cd Hot_click_outlet/frontend && corepack pnpm install --frozen-lockfile --ignore-scripts && corepack pnpm test -- --run); fi
