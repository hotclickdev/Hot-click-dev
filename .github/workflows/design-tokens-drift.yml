name: S5 — Weekly design tokens drift

on:
  schedule:
    # Lunes 08:30 America/Costa_Rica = 14:30 UTC
    - cron: '30 14 * * 1'
  workflow_dispatch:

concurrency:
  group: design-tokens-drift
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  scan:
    name: S5 design-drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Escanear hex / style={{ (Issue, sin rewrite)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/eng-gates/design-tokens-drift.mjs
