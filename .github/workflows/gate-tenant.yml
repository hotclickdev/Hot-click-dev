name: E2 — Reviewer de tenant

# DISABLED 2026-09-14 — awaiting reorg
on:
  workflow_dispatch:
# ORIGINAL TRIGGERS (restore to re-enable):
# on:
#   pull_request:
#     branches: [ master ]
#     paths:
#       - 'Hot_click_outlet/src/main/java/**/controller/**/*.java'
#       - 'Hot_click_outlet/src/main/java/**/service/**/*.java'
#       - 'Hot_click_outlet/src/main/java/**/repository/**/*.java'
#       - 'scripts/eng-gates/**'
#       - '.github/workflows/gate-tenant.yml'

concurrency:
  group: gate-tenant-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  tenant:
    name: E2 Tenant / IDOR / PgBouncer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: E2 escanear diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/eng-gates/gate-tenant.mjs
