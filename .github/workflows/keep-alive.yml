name: Keep Render Alive

on:
  schedule:
    - cron: '*/10 * * * *'  # Cada 10 minutos — Render duerme tras 15 min sin tráfico
  workflow_dispatch:         # Permite ejecutarlo manualmente desde GitHub

# E9 (status-only pager) vive en health-pager.yml.
# D12 (cuerpo + HTML-as-fail, Issue outage) vive en real-health.yml.
# Este workflow solo pinea para que Render no duerma. No hace git push.

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: |
          set -euo pipefail
          URL="${HEALTH_URL:-https://hot-click-dev.onrender.com/api/health}"
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "$URL" || echo 000)
          echo "Status: $STATUS url=$URL"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: health check returned $STATUS (E9 pager abre Issue solo tras 2 fallos seguidos)"
          fi
        env:
          HEALTH_URL: ${{ secrets.HEALTH_URL }}

