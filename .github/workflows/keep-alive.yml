name: Keep Render Alive

on:
  schedule:
    - cron: '*/10 * * * *'  # Cada 10 minutos — Render duerme tras 15 min sin tráfico
  workflow_dispatch:         # Permite ejecutarlo manualmente desde GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://hot-click-dev.onrender.com/api/health)
          echo "Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: health check returned $STATUS"
          fi
