name: Seguridad — al merge

# Push a master = merge. El job rápido también corre en el PR para no enterarse en master.
# DAST (app encendida + ZAP) solo en el push a master y en workflow_dispatch.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: seguridad-al-merge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  registro:
    name: Amenazas, pentest y args del copilot
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Gate de registro
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PR_LABELS: ${{ github.event_name == 'pull_request' && join(github.event.pull_request.labels.*.name, ',') || '' }}
        run: node scripts/eng-gates/seguridad-merge.mjs

  dast:
    name: ZAP baseline (app en perfil dev)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: hotclick_dev
          POSTGRES_USER: hotclick_dev
          POSTGRES_PASSWORD: hotclick_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hotclick_dev -d hotclick_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Java 21
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup Maven
        run: sudo apt-get install -y maven --quiet

      - name: Arrancar perfil dev
        env:
          SENTRY_DSN: ""
        run: |
          set -euo pipefail
          mvn -f Hot_click_outlet/pom.xml spring-boot:run \
            -Dspring-boot.run.profiles=dev \
            --no-transfer-progress \
            > /tmp/boot-dev.log 2>&1 &
          echo $! > /tmp/boot-dev.pid
          for i in $(seq 1 180); do
            if grep -q "Started HotclickApplication" /tmp/boot-dev.log; then
              echo "App lista"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/boot-dev.pid)" 2>/dev/null; then
              echo "FAIL — el proceso murió antes de Started"
              tail -n 200 /tmp/boot-dev.log
              exit 1
            fi
            sleep 5
          done
          echo "FAIL — timeout esperando Started HotclickApplication"
          tail -n 200 /tmp/boot-dev.log
          exit 1

      - name: ZAP baseline
        run: bash scripts/eng-gates/dast-zap-baseline.sh

      - name: Apagar la app
        if: always()
        run: |
          if [[ -f /tmp/boot-dev.pid ]]; then
            kill "$(cat /tmp/boot-dev.pid)" 2>/dev/null || true
          fi

      - name: Subir reporte ZAP
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zap-baseline
          path: zap-out/
          if-no-files-found: ignore
