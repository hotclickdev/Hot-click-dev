name: S11 — Weekly Hacienda XML vs builders

on:
  schedule:
    # Jueves 08:00 America/Costa_Rica = 14:00 UTC
    - cron: '0 14 * * 4'
  workflow_dispatch:

concurrency:
  group: hacienda-xml-drift
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  xml:
    name: S11 Hacienda XML
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Diff sample/XSD vs XmlFacturaBuilder (Issue-only)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/eng-gates/hacienda-xml-drift.mjs
