# E2E full-stack: Postgres + backend (perfil dev) + frontend (Vite) + Playwright.
# Bloquea el merge si se marca como check requerido "E2E Playwright (full-stack)".
# Sin secretos de Clerk/ONVO los flujos reales en modo prueba se omiten (skip documentado)
# y se validan los caminos fail-closed. Nunca usa llaves live ni toca producción.
name: E2E full-stack

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E Playwright (full-stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: hotclick_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      BACKEND_PORT: '8080'
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      VITE_API_PROXY: http://127.0.0.1:8080
      # Solo se usan si existen como secretos del repo (instancia dev / modo prueba).
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # v5.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build backend (sin tests; los corre ci.yml)
        working-directory: Hot_click_outlet
        run: mvn -B -q -DskipTests package

      - name: Clave QA efímera
        run: |
          pass="E2e-$(openssl rand -hex 16)!"
          echo "::add-mask::$pass"
          echo "E2E_QA_PASSWORD=$pass" >> "$GITHUB_ENV"

      - name: Arrancar backend (perfil dev)
        working-directory: Hot_click_outlet
        env:
          SPRING_PROFILES_ACTIVE: dev
          SERVER_PORT: ${{ env.BACKEND_PORT }}
          SPRING_DATASOURCE_URL: jdbc:postgresql://127.0.0.1:5432/hotclick_dev
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
          CORS_ALLOWED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
          ONVO_SECRET_KEY_CANDIDATA: ${{ secrets.E2E_ONVO_SECRET_KEY }}
        run: |
          export QA_DEFAULT_PASSWORD="$E2E_QA_PASSWORD"
          # Solo llaves de prueba: una llave que no sea onvo_test_ se descarta.
          if [[ "$ONVO_SECRET_KEY_CANDIDATA" == onvo_test_* ]]; then
            export ONVO_SECRET_KEY="$ONVO_SECRET_KEY_CANDIDATA"
            echo "E2E_ONVO_MODO=prueba" >> "$GITHUB_ENV"
          fi
          unset ONVO_SECRET_KEY_CANDIDATA
          nohup java -Xmx1g -jar target/hot-click-outlet-1.0.0.jar > "$RUNNER_TEMP/backend.log" 2>&1 &
          for _ in $(seq 1 90); do
            if curl -fsS "http://127.0.0.1:${BACKEND_PORT}/api/public/auth-config" > /dev/null; then
              echo "backend listo"; exit 0
            fi
            sleep 2
          done
          echo "::error::el backend no arrancó"; tail -n 80 "$RUNNER_TEMP/backend.log"; exit 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.2

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: Hot_click_outlet/frontend/pnpm-lock.yaml

      - name: Instalar frontend + Chromium
        working-directory: Hot_click_outlet/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Playwright full-stack
        working-directory: Hot_click_outlet/frontend
        env:
          CI: 'true'
          # BD efímera del service (credenciales de juguete): la usa 07-pos para vencer un QR.
          E2E_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/hotclick_dev
        run: pnpm test:e2e:fullstack

      - name: Subir reporte
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-fullstack-report
          retention-days: 14
          path: |
            Hot_click_outlet/frontend/playwright-report-fullstack
            Hot_click_outlet/frontend/test-results-fullstack
            ${{ runner.temp }}/backend.log
