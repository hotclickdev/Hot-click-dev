#   pull_request:
#     branches: [master]
#     paths:
#       - 'Hot_click_outlet/frontend/src/i18n/locales/**'
#       - 'Hot_click_outlet/frontend/src/**/*.tsx'
#       - 'Hot_click_outlet/frontend/src/**/*.jsx'
