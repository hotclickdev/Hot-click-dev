name: E13 — Push SPA pnpm build reminder

on:
  push:
    branches: [master]
    paths:
      - 'Hot_click_outlet/frontend/**'
      - 'Hot_click_outlet/src/main/resources/static/**'
  workflow_dispatch:

concurrency:
  group: spa-push-reminder-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  reminder:
    name: E13 static vs frontend hash
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Comentar el commit (no deploy)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.sha }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/eng-gates/spa-push-reminder.mjs
