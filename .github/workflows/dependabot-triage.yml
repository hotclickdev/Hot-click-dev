name: E6 — Dependabot triage

on:
  pull_request:
    branches: [ master ]
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: dependabot-triage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  triage:
    name: E6 Labels y bloqueo de majors críticos
    runs-on: ubuntu-latest
    steps:
      - name: No aplica (no es Dependabot)
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: echo "E6 solo corre en PRs cuyo autor es dependabot[bot] — PASS."

      - name: Checkout
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node 22
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Triage
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/eng-gates/dependabot-triage.mjs
