name: E3 — Gate SPA / pnpm build

# DISABLED 2026-09-14 — awaiting reorg
on:
  workflow_dispatch:
# ORIGINAL TRIGGERS (restore to re-enable):
# on:
#   pull_request:
#     branches: [ master ]
#     paths:
#       - 'Hot_click_outlet/frontend/src/**'
#       - 'Hot_click_outlet/src/main/resources/static/**'
#       - 'scripts/eng-gates/**'
#       - '.github/workflows/gate-spa.yml'

concurrency:
  group: gate-spa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  spa:
    name: E3 Artefactos static/ vs frontend/src
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.2

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: Hot_click_outlet/frontend/pnpm-lock.yaml

      - name: Decidir fast-path vs build
        id: spa
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/eng-gates/gate-spa.mjs

      - name: Instalar frontend
        if: steps.spa.outputs.action == 'build'
        working-directory: Hot_click_outlet/frontend
        run: pnpm install --frozen-lockfile

      - name: pnpm build y comparar static/
        if: steps.spa.outputs.action == 'build'
        working-directory: Hot_click_outlet/frontend
        env:
          VITE_SENTRY_DSN: ""
          VITE_APP_RELEASE: "ci-spa-gate"
          VITE_POSTHOG_PROJECT_TOKEN: ""
          VITE_POSTHOG_HOST: "https://us.i.posthog.com"
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
          VITE_STRIPE_PUBLIC_KEY: pk_test_placeholder
        run: |
          set -euo pipefail
          pnpm build
          git add -N ../src/main/resources/static
          if git diff --quiet -- ../src/main/resources/static; then
            echo "E3: el bundle no cambió; static/ no está stale."
            exit 0
          fi
          echo "::error::E3: static/ está stale respecto de frontend/src. Corré pnpm build y commiteá Hot_click_outlet/src/main/resources/static/ (Docker no buildea React)."
          git --no-pager diff --stat -- ../src/main/resources/static | head
          exit 1

      - name: Comentar stale SPA
        if: failure() && steps.spa.outputs.action == 'build'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node --input-type=module -e "
            import { upsertPrComment } from './scripts/eng-gates/github.mjs';
            upsertPrComment('hotclick-gate-spa', [
              '## E3 Gate SPA',
              '',
              '**FAIL** — \`pnpm build\` dejó \`src/main/resources/static/\` distinto al del PR.',
              '',
              'La imagen Docker **no** compila React. Sin este commit, prod sirve JS viejo.',
              '',
              '\`cd Hot_click_outlet/frontend && pnpm build\` y subí \`static/\`.',
              '',
              'Label \`skip-spa-gate\` solo si el cambio de src no afecta el bundle (falso positivo).',
            ].join('\\n'));
          "
