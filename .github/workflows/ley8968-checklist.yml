name: S7 — Weekly Ley 8968 checklist

on:
  schedule:
    # Martes 08:00 America/Costa_Rica = 14:00 UTC
    - cron: '0 14 * * 2'
  workflow_dispatch:

concurrency:
  group: ley8968-checklist
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  checklist:
    name: S7 Ley 8968
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Heurística FE+BE (privacidad, consent, IP, ARCO)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/eng-gates/ley8968-checklist.mjs
