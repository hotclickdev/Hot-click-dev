name: Security — Escaneo de secretos

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  gitleaks:
    name: gitleaks detect
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Descargar gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: gitleaks detect
        run: |
          set +e
          ./gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1 --verbose --report-format json --report-path gitleaks-report.json
          code=$?
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("gitleaks-report.json")
          if not p.exists():
              print("No gitleaks-report.json")
              raise SystemExit(0)
          data = json.loads(p.read_text(encoding="utf-8") or "[]")
          print(f"LEAK_COUNT={len(data)}")
          for f in data:
              fp = f.get("Fingerprint", "")
              rule = f.get("RuleID", "")
              path = f.get("File", "")
              line = f.get("StartLine", 1)
              commit = (f.get("Commit") or "")[:12]
              # Anotacion sin el secreto: visible en la API de checks
              print(f"::error file={path},line={line}::{fp} rule={rule} commit={commit}")
          PY
          exit $code
